<!-- ======================= TRIAL CAMPAIGN（お試しキャンペーン） =======================
     claude.ai/design「TrialCampaignSection」からの移植（静的HTML化）。
     富山・石川・岐阜の各ボタンは現行導線（index.html?login=1 のログイン/はじめての方モーダル）へ遷移。
     お試しキャンペーン専用ページができたら遷移先を差し替える。 -->
<section data-section="trial-campaign" style="background:#fff;padding:34px 0 56px">
  <style>
    .tcamp-inner{max-width:960px;margin:0 auto;padding:0 24px}
    .tcamp-hero{position:relative;display:flex;justify-content:center;align-items:flex-end;padding:0 0 30px}
    .tcamp-art{width:100%;max-width:440px;height:auto;display:block;position:relative;z-index:1;margin:0 auto}
    .tcamp-mascot{position:absolute;z-index:3;right:0;bottom:0;width:15%;height:auto;display:block}
    .tcamp-ask{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:22px;padding-top:26px;border-top:2px dashed #EADFCC}
    .tcamp-ask h2{margin:0;font-size:25px;font-weight:700;color:#3E3A34;line-height:1.5;font-family:'Zen Maru Gothic',sans-serif;letter-spacing:.01em}
    .tcamp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
    .tcamp-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border:none;border-radius:22px;min-height:76px;text-align:left;cursor:pointer;font-family:inherit;transition:transform .16s ease}
    .tcamp-card:hover{transform:translateY(-2px)}
    .tcamp-map{display:flex;align-items:center;justify-content:center;width:58px;height:58px;flex-shrink:0}
    .tcamp-name-col{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;flex:1;min-width:0}
    .tcamp-name{font-size:19px;font-weight:700;color:#3E3A34;font-family:'Zen Maru Gothic',sans-serif;line-height:1.4}
    .tcamp-chev{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.85);color:#9E9483}
    .tcamp-help{display:flex;flex-direction:column;align-items:center;gap:11px;margin-top:26px;text-align:center}
    .tcamp-help-text{font-size:12.5px;color:#8A8378;line-height:1.85}
    .tcamp-help-link{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:#8A7A62;background:#fff;border-radius:999px;padding:11px 20px;min-height:44px;box-shadow:0 0 0 1.5px #E4DAC8 inset;text-decoration:none}
    @keyframes tcamp-fade{from{opacity:0}to{opacity:1}}
    @keyframes tcamp-pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @media(max-width:768px){
      [data-section="trial-campaign"]{padding:20px 16px 34px !important}
      .tcamp-inner{padding:0}
      .tcamp-hero{padding-bottom:26px}
      .tcamp-art{max-width:300px}
      .tcamp-mascot{width:19%}
      .tcamp-ask{margin-top:16px;padding-top:22px}
      .tcamp-ask h2{font-size:20px}
      .tcamp-grid{grid-template-columns:1fr;gap:11px;margin-top:20px}
      .tcamp-card{padding:13px 14px}
      .tcamp-name{font-size:17px}
      .tcamp-help{margin-top:22px}
    }
  </style>
