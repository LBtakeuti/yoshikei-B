<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヨシケイ楽楽web モック（PC/SP統合）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:#ECECEC;font-family:'Zen Kaku Gothic New',sans-serif;}
  a{color:#E50012;text-decoration:none;}
  a:hover{color:#B10010;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;margin:0;}
  .hs{scrollbar-width:none;}
  .hs::-webkit-scrollbar{display:none;}
  .ps::-webkit-scrollbar{width:8px;height:8px;}
  .ps::-webkit-scrollbar-thumb{background:#D6D6D6;border-radius:4px;}
  @keyframes rk-up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes rk-fade{from{opacity:0;}to{opacity:1;}}
  @keyframes rk-pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes rk-slide{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
  /* 子タブのドロップダウン（コンテンツに覆いかぶさるオーバーレイ） */
  .dd-anchor{position:relative;}
  .dd-menu{
    position:absolute;left:8px;right:8px;top:100%;margin-top:6px;z-index:60;
    background:#CE5C50;border-radius:12px;overflow:hidden;
    box-shadow:0 14px 34px rgba(0,0,0,.30);
    animation:dd-open .18s ease;transform-origin:top center;
  }
  @keyframes dd-open{from{opacity:0;transform:translateY(-8px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
  .dd-item{display:block;width:100%;padding:13px 18px;color:#fff;font-size:13.5px;font-weight:700;text-align:center;white-space:nowrap;transition:background .12s ease;}
  .dd-item+.dd-item{border-top:1px solid rgba(255,255,255,.45);}
  .dd-item:hover{background:rgba(255,255,255,.16);}
  /* ログインフロー（yoshikei-login-flow.html より移植） */
  .onboard-illust{display:block;margin:6px auto 22px;height:110px;max-width:70vw;width:auto;}
  .onboard-q-title{font-size:22px;font-weight:700;color:#3a3a3a;line-height:1.5;margin-bottom:8px;min-height:66px;display:flex;align-items:flex-start;}
  .tk-btn{position:relative;overflow:hidden;transition:color .3s ease;}
  .tk-btn>span{position:relative;z-index:1;}
  .tk-btn::before{content:'';position:absolute;inset:0;background:#E50012;transform:scale(.97);opacity:0;transition:transform .3s ease,opacity .3s ease;z-index:0;}
  .tk-btn:hover::before{transform:scale(1);opacity:1;}
  .tk-btn:hover>span{color:#fff;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
  }
  /* 画像プレースホルダー（lp.html と共通の見た目） */
  .ph-box{background:#ebe9e4;border:1px dashed #c7c3ba;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#8a8578;font-size:12px;font-weight:700;text-align:center;line-height:1.4;overflow:hidden;box-sizing:border-box;padding:6px;}
  .ph-box svg{width:26px;height:26px;opacity:.65;flex:none;}
  .ph-box span{padding:0 6px;max-width:100%;}
  /* ECトップ ヒーローセクション（未ログインのゲスト閲覧時のみ表示） */
  .echero{position:relative;height:218px;background:#FBF7EE;display:flex;align-items:center;overflow:hidden}
  .echero-photo{position:absolute;top:0;bottom:0;right:0;left:56%}
  .echero-scrim{position:absolute;inset:0;background:linear-gradient(90deg,#FBF7EE 0%,#FBF7EE 56%,rgba(251,247,238,.72) 68%,rgba(251,247,238,0) 84%)}
  .echero-inner{position:relative;z-index:2;padding-left:20px;display:flex;flex-direction:column;gap:14px;max-width:238px}
  .echero-catch{margin:0;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:26px;line-height:1.35;color:#3E3A34;letter-spacing:.01em;word-break:keep-all}
  .echero-week{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px}
  .echero-badge{font-size:11.5px;font-weight:700;color:#fff;background:#E50012;border-radius:999px;padding:4px 11px;letter-spacing:.02em}
  .echero-weektext{font-size:13.5px;font-weight:700;color:#3E3A34;font-family:'Zen Maru Gothic',sans-serif;word-break:keep-all}
  .echero-deadline{font-size:12.5px;font-weight:500;color:#7C6E58;background:#fff;border-radius:8px;padding:5px 10px;border:1px solid #E7DCC7}
  @media (min-width:1024px){
    .echero{height:270px}
    .echero-photo{left:46%}
    .echero-scrim{background:linear-gradient(90deg,#FBF7EE 0%,#FBF7EE 48%,rgba(251,247,238,.85) 58%,rgba(251,247,238,0) 74%)}
    .echero-inner{padding-left:56px;gap:20px;max-width:560px}
    .echero-catch{font-size:44px}
    .echero-badge{font-size:12.5px;padding:5px 13px}
    .echero-weektext{font-size:16px}
    .echero-deadline{font-size:13.5px;padding:6px 12px}
  }
  /* バナーカルーセル（未ログインのゲストトップ・ヒーロー直下）
     将来は管理画面から入稿した横長画像を .bnr-img に差し替える。img 未設定の間は
     テーマ色のグラデーション帯＋破線フレームで「画像入稿エリア」を明示する。 */
  .bnr-wrap{position:relative;background:#fff;padding:14px 0 4px}
  .bnr-stage{position:relative}
  .bnr-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 7%;-webkit-overflow-scrolling:touch}
  .bnr-item{position:relative;flex:0 0 86%;scroll-snap-align:center;aspect-ratio:21/9;border-radius:14px;overflow:hidden;display:block;text-align:left;padding:0}
  .bnr-img{width:100%;height:100%;object-fit:cover;display:block}
  .bnr-frame{position:absolute;inset:6px;border:1.5px dashed rgba(255,255,255,.55);border-radius:10px;pointer-events:none}
  .bnr-note{position:absolute;top:8px;right:10px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.94);background:rgba(0,0,0,.22);border-radius:6px;padding:2px 8px;letter-spacing:.02em}
  .bnr-body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 18px}
  .bnr-label{font-family:'Zen Maru Gothic',sans-serif;font-size:15px;font-weight:900;line-height:1.35;letter-spacing:.01em;word-break:keep-all}
  .bnr-sub{font-size:11.5px;font-weight:700;line-height:1.4}
  .bnr-dots{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0 2px}
  .bnr-dot{height:7px;border-radius:4px;transition:width .2s ease,background .2s ease}
  .bnr-arrow{display:none}
  /* PC：カルーセル全体をコンテンツ幅（1200px）で中央寄せし、peek なしの1枚表示にする
     （隣がちら見えする peek 演出は SP のみ）。左右 56px のガターを空けてそこに矢印を置くため、
     ワイド画面でもバナーが巨大化せず、矢印がキャッチコピーに重ならない。 */
  @media (min-width:1024px){
    .bnr-wrap{padding:20px 0 6px;max-width:1200px;margin:0 auto}
    .bnr-track{gap:24px;padding:0 56px;scroll-padding:0 56px}
    .bnr-item{flex:0 0 100%;aspect-ratio:4/1;border-radius:16px}
    .bnr-frame{inset:9px;border-radius:12px}
    .bnr-body{padding:0 40px;gap:9px}
    .bnr-label{font-size:26px}
    .bnr-sub{font-size:14px}
    .bnr-note{font-size:11px;top:12px;right:14px;padding:3px 9px}
    /* 矢印はカルーセルの左右端・上下中央に固定（バナーの外側 56px ガター内） */
    .bnr-arrow{display:flex;position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18);align-items:center;justify-content:center;color:#3E3A34;z-index:3}
    .bnr-arrow:hover{background:#FCEBEC;color:#E50012}
    .bnr-prev{left:7px}
    .bnr-next{right:7px}
  }
  /* PC / SP 切り替え（1024px） */
  #pc-root{display:none;}
  #sp-root{display:block;}
  @media (min-width:1024px){
    #pc-root{display:block;}
    #sp-root{display:none;}
  }
  /* デモ用：表示案A/B切替の位置。SP幅では左下（フッターナビ上）へ退避し検索・絞り込み等と重ならないようにする。PC幅は右上のまま。 */
  .demo-toggle{position:fixed;left:8px;bottom:80px;right:auto;top:auto;z-index:70;}
  .demo-toggle button{border-radius:10px !important;}
  @media (min-width:1024px){
    .demo-toggle{left:auto;bottom:auto;right:0;top:70px;}
    .demo-toggle button{border-radius:10px 0 0 10px !important;}
  }
  /* LPフッター（lp.html から移植・未ログイン時のトップ最下部に表示）
     LP側はインラインスタイルだが、こちらはクラスに置き換えてレスポンシブを同じ挙動で再現する。 */
  .lpft{padding:60px 40px 30px;background:#fff;border-top:1px solid #f0eee9;}
  .lpft a{color:inherit;text-decoration:none;}
  .lpft a:hover{color:#E50012;}
  .lpft-inner{max-width:1200px;margin:0 auto;}
  .lpft-grid{display:grid;grid-template-columns:300px 1fr 1fr;gap:40px;align-items:start;}
  .lpft-logo{display:flex;align-items:center;margin-bottom:20px;}
  .lpft-logo img{height:26px;width:auto;display:block;}
  .lpft-icons{display:flex;gap:3px;flex-wrap:wrap;max-width:280px;}
  .lpft-tel{margin-top:18px;display:flex;flex-direction:column;gap:3px;}
  .lpft-tel-lbl{font-size:12px;color:#8a8578;font-weight:700;}
  .lpft-tel-num{font-size:16px;font-weight:800;color:#E50012;line-height:1.5;}
  .lpft-nav{display:flex;flex-direction:column;gap:16px;font-size:15px;font-weight:500;color:#333;}
  .lpft-sub{display:flex;flex-direction:column;gap:14px;font-size:13px;color:#777;}
  .lpft-gap{height:8px;}
  .lpft-ext{display:inline-block;margin-left:4px;vertical-align:middle;}
  .lpft-bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px;padding-top:20px;flex-wrap:wrap;gap:18px;}
  .lpft-icons2{display:flex;gap:3px;flex-wrap:wrap;max-width:300px;}
  .lpft-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .lpft-copy{font-size:11px;color:#aaa;}
  .lpft-sns{display:flex;gap:12px;}
  .lpft-sns a{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
  .lpft-sns .lpft-line{background:#06c755;color:#fff;font-size:10px;font-weight:800;font-family:'Zen Maru Gothic',sans-serif;}
  .lpft-sns .lpft-dark{background:#222;}
  @media (max-width:1023px){
    .lpft{padding:56px 22px;}
    .lpft-grid{grid-template-columns:1fr;gap:34px;}
  }
  @media (max-width:768px){
    .lpft{padding-left:18px;padding-right:18px;}
  }
</style>
</head>
<body>
<div id="sp-root"></div>
<div id="pc-root"></div>

<!-- ======== LPフッター用の野菜アイコン（lp.html と同一のシンボル定義） ========
     sp-root / pc-root は innerHTML で描き替えるため、参照元のシンボルは静的に置く。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-carrot" viewBox="0 0 100 100"><path d="M28 36c-5-3-8-10-6-15 6 2 11 7 12 13z" fill="#509146"></path><path d="M50 32c-2-6-1-14 3-18 5 4 5 13 2 19z" fill="#509146"></path><path d="M40 34c-4-5-6-13-3-18 5 3 8 12 7 18z" fill="#509146"></path><path d="M30 37 58 41 45 86c-1 4-4 4-5 0z" fill="#E50012"></path><g stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".55"><path d="M38 50 50 52"></path><path d="M37 62 47 64"></path><path d="M35 73 44 75"></path></g></symbol>
  <symbol id="ic-broccoli" viewBox="0 0 100 100"><rect x="44" y="48" width="12" height="36" rx="6" fill="#7cae5e"></rect><circle cx="38" cy="40" r="14" fill="#509146"></circle><circle cx="60" cy="38" r="15" fill="#509146"></circle><circle cx="50" cy="29" r="13" fill="#509146"></circle><circle cx="46" cy="47" r="12" fill="#509146"></circle><circle cx="63" cy="50" r="10" fill="#509146"></circle></symbol>
  <symbol id="ic-mushroom" viewBox="0 0 100 100"><rect x="42" y="50" width="16" height="32" rx="8" fill="#e7cfa6"></rect><path d="M22 54c0-22 56-22 56 0z" fill="#E50012"></path><circle cx="38" cy="46" r="3.4" fill="#fff" opacity=".85"></circle><circle cx="55" cy="44" r="3" fill="#fff" opacity=".85"></circle><circle cx="64" cy="49" r="2.6" fill="#fff" opacity=".85"></circle></symbol>
  <symbol id="ic-orange" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="#E50012"></circle><circle cx="50" cy="50" r="26" fill="#ffb729"></circle><g stroke="#fff" stroke-width="3"><path d="M50 24v52"></path><path d="M24 50h52"></path><path d="M32 32 68 68"></path><path d="M68 32 32 68"></path></g><circle cx="50" cy="50" r="5" fill="#fff"></circle></symbol>
  <symbol id="ic-pepper" viewBox="0 0 100 100"><path d="M30 41c0-4 6-6 10-4 4-3 16-3 20 0 4-2 10 0 10 4 6 8 4 30-10 38-8 5-12 5-20 0-14-8-16-30-10-38z" fill="#e8623f"></path><rect x="46" y="22" width="8" height="16" rx="4" fill="#509146"></rect><path d="M50 30c4-4 10-4 12 0" stroke="#509146" stroke-width="5" fill="none" stroke-linecap="round"></path></symbol>
  <symbol id="ic-pea" viewBox="0 0 100 100"><path d="M22 64C24 40 60 24 80 28 78 50 44 70 24 70c-2-1-3-4-2-6z" fill="#509146"></path><circle cx="40" cy="55" r="6" fill="#9ccb7a"></circle><circle cx="52" cy="49" r="6" fill="#9ccb7a"></circle><circle cx="64" cy="43" r="6" fill="#9ccb7a"></circle></symbol>
  <symbol id="ic-leaf" viewBox="0 0 100 100"><path d="M26 74C26 40 56 24 78 26 80 50 60 76 30 76c-2 0-4-1-4-2z" fill="#509146"></path><path d="M34 70C46 52 62 38 74 32" stroke="#9ccb7a" stroke-width="3" fill="none" stroke-linecap="round"></path></symbol>
  <symbol id="ic-ladle" viewBox="0 0 100 100"><rect x="54" y="14" width="7" height="44" rx="3.5" fill="#b9b6ab"></rect><path d="M36 56c0 18 28 18 28 0z" fill="#b9b6ab"></path><path d="M40 58c0 12 20 12 20 0z" fill="#d2cfc5"></path></symbol>
  <symbol id="ic-pot" viewBox="0 0 100 100"><rect x="26" y="44" width="48" height="34" rx="6" fill="#E50012"></rect><rect x="13" y="52" width="13" height="7" rx="3.5" fill="#E50012"></rect><rect x="74" y="52" width="13" height="7" rx="3.5" fill="#E50012"></rect><rect x="24" y="36" width="52" height="9" rx="4.5" fill="#B0101A"></rect><rect x="45" y="28" width="10" height="9" rx="4" fill="#B0101A"></rect></symbol>
  <symbol id="ic-egg" viewBox="0 0 100 100"><path d="M50 22c16 0 24 32 20 48-4 14-36 14-40 0-4-16 4-48 20-48z" fill="#fff" stroke="#e9e2d6" stroke-width="2"></path><circle cx="50" cy="58" r="13" fill="#ffb729"></circle></symbol>

  <symbol id="ic-tomato" viewBox="0 0 100 100"><circle cx="50" cy="56" r="28" fill="#e8623f"></circle><path d="M50 30 42 22M50 30v-10M50 30l8-8" stroke="#509146" stroke-width="5" stroke-linecap="round"></path><circle cx="40" cy="48" r="5" fill="#fff" opacity=".25"></circle></symbol>
  <symbol id="ic-eggplant" viewBox="0 0 100 100"><path d="M64 30c12 8 14 30 0 44-14 14-36 8-38-8-2-14 14-22 26-24 6-2 8-8 12-12z" fill="#8d7793"></path><path d="M62 28c4-4 10-4 12 0-4 4-8 4-12 6z" fill="#509146"></path></symbol>
  <symbol id="ic-knife" viewBox="0 0 100 100"><path d="M30 60 66 24c6 6 4 16-6 26L42 68z" fill="#cfccc2"></path><rect x="22" y="63" width="22" height="9" rx="4.5" transform="rotate(45 33 67)" fill="#5c5246"></rect></symbol>
</svg>

<!-- ======== ログインモーダル（PC/SP共通・参照: yoshikei-login-flow.html） ======== -->
<div data-login-overlay style="position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:20px;max-width:400px;width:100%;padding:30px 26px;position:relative;text-align:center;">
    <button data-login-close aria-label="閉じる" style="position:absolute;top:14px;right:14px;width:30px;height:30px;border:none;border-radius:50%;background:#f2efea;color:#666;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;">×</button>
    <img src="assets/logo.svg" alt="ヨシケイ楽楽web" style="height:30px;width:auto;display:block;margin:0 auto 18px;">
    <div style="font-size:20px;font-weight:700;color:#3a3a3a;margin-bottom:20px;">ログイン / はじめての方</div>
    <input data-login-email type="email" placeholder="メールアドレス" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;margin-bottom:12px;">
    <button data-login-submit class="tk-btn" style="width:100%;border:none;background:#E50012;color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:12px;"><span>ログイン</span></button>
    <div style="display:flex;align-items:center;gap:12px;margin:22px 0 16px;"><span style="flex:1;height:1px;background:#eee;"></span><span style="font-size:12px;color:#999;font-weight:700;">はじめての方</span><span style="flex:1;height:1px;background:#eee;"></span></div>
    <button data-onboard-start style="width:100%;border:2px solid #E50012;background:#fff;color:#E50012;font-size:15px;font-weight:700;padding:13px;border-radius:12px;">無料ではじめる（かんたん7つの質問）</button>
  </div>
</div>

<!-- ======== オンボーディング（7つの質問） ======== -->
<div data-onboard-overlay style="position:fixed;inset:0;z-index:500;background:#fff;display:none;flex-direction:column;">
  <div style="flex:none;padding:18px 20px 0;max-width:560px;margin:0 auto;width:100%;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-weight:800;font-size:15px;color:#E50012;letter-spacing:.04em;">Welcome</div>
      <button data-onboard-close aria-label="閉じる" style="width:30px;height:30px;border:none;border-radius:50%;background:#f2efea;color:#666;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;">×</button>
    </div>
    <div style="height:6px;border-radius:3px;background:#f0ede8;overflow:hidden;"><div data-onboard-bar style="height:100%;width:0;background:#E50012;transition:width .35s ease;"></div></div>
    <div data-onboard-step style="font-size:12px;color:#999;font-weight:700;margin-top:8px;text-align:center;">1 / 7</div>
  </div>
  <div data-onboard-body style="flex:1;overflow-y:auto;padding:24px 20px 40px;max-width:560px;margin:0 auto;width:100%;"></div>
</div>

<!-- ======== 検索オーバーレイ（商品名・カテゴリ検索／PC・SP共通） ======== -->
<div data-search-overlay style="position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:22px 14px;">
  <div style="width:100%;max-width:560px;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;max-height:82vh;box-shadow:0 24px 60px rgba(0,0,0,.35);">
    <div style="display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #EEE;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input data-search-input type="text" placeholder="商品名・カテゴリで検索（例：親子丼、カットミール）" style="flex:1;border:none;outline:none;font-size:14px;font-family:inherit;color:#333;min-width:0;">

/* 通し割引（正式ルール）：判定単位はシリーズ（コース）×週。
   同一シリーズ（tag を正規化：カット有無サフィックス・楽◯◯を吸収）の商品を、

   カット有無・利用人数の混在は同一シリーズ扱い。
   対象は★印コース＝ミールキット系（cat が smile/more/lovyu）のみ。単品(tanpin)・特別販売(special)は対象外。
   割引額はモックのため対象合計の5%（10円未満切り捨て）を維持。
   本実装では通常価格と通し割引価格（基幹 menu.urine2）の差額合計に置き換える。 */
function cartDiscount(){
  const groups={};  // key: 正規化シリーズ|週 → {days:{}, base:number}
  S.cartItems.forEach(c=>{
    const cat=c.cat||catFor(c.tag);
    if(cat!=='smile'&&cat!=='more'&&cat!=='lovyu')return;  // 単品・特別販売は対象外
    const key=seriesBase(c.tag)+'|'+(c.week||'');
    const g=groups[key]||(groups[key]={days:{},base:0});
    g.days[c.day||c.week||'?']=true;   // 異なるお届け日をカウント（数量ではなく日数）
    g.base+=c.price*c.qty;
  });
  let base=0;
  Object.keys(groups).forEach(k=>{
    const g=groups[k];
    if(Object.keys(g.days).length>=5)base+=g.base;  // 週内5日または6日で成立（上限6は日付数で自然に頭打ち）
  });
  return Math.floor(base*0.05/10)*10;
}

  goSeries(){S.topMode='series';render();},
  goDelivery(){S.topMode='delivery';render();},
  setDay(i){S.activeDay=i;render();},
  goHome(){S.page=null;render();},
  openHelp(){S.page='help';render();},
  openSpecialPage(){S.page='specialPage';render();},
  toggleSpecialMode(){
    S.specialMode=S.specialMode==='A'?'B':'A';
    if(S.specialMode==='A'&&S.page==='specialPage')S.page=null; // 独立ページは案B専用
    render();
  },
  openNews(){S.page='news';render();},
  openContact(){S.page='contact';render();},
  openMypage(){if(!S.loggedIn){Login.open();return;}S.page='mypage';render();},
  openCart(){S.page='cart';render();},
  openProfile(){S.page='profile';render();},
  profileSave(){
    const el=document.querySelector('[data-prof-name]');
    if(el&&el.value.trim())S.userName=el.value.trim();
    S.profileSaved=true;render();
  },
  profileSavedClose(){S.profileSaved=false;render();},
  openLogin(){S.menuOpen=false;render();Login.open();},
  /* 「はじめての方」＝ログインモーダル内の仮登録フロー入口と同じ処理を直接起動 */
  openSignup(){S.menuOpen=false;render();Login.signup();},
  toggleMenu(){S.menuOpen=!S.menuOpen;render();},
  /* デモ用：表示地域の切替（エリア確認を通らずに地域別表示を確認する） */
  setRegion(key){setRegion(key);render();},
  logout(){S.loggedIn=false;S.userName=null;S.page=null;location.href='lp.html';},

  /* 未ログイントップ（雑誌型）⇄ フルメニューの切り替え（リロードなし・再描画のみ） */
  guestShowAll(){S.guestFull=true;S.page=null;render();Banner.jump('guest-full');},
  guestBackTop(){S.guestFull=false;S.page=null;render();window.scrollTo({top:0,behavior:'smooth'});},

  /* 週の切り替え（複数週にわたり同一画面で注文可能） */
  setWeek(i){S.week=i;render();},
  nextWeek(){if(S.week<WEEKS.length-1)S.week++;S.page=null;render();window.scrollTo(0,0);},

  /* タブ（親／子／孫） */
  setMainTab(t){S.mainTab=t;S.ddOpen=null;render();},
  toggleDD(key){S.ddOpen=S.ddOpen===key?null:key;render();},
  setChild(key,idx){
    if(SPECIAL_TABS.some(t=>t.key===key)){S.specialChild=key;}
    else{S.child=key;}
    if(idx!==undefined)S.sub[key]=idx;
    S.ddOpen=null;render();
  },

  /* カレンダー */
  calPrev(){S.calM--;if(S.calM<1){S.calM=12;S.calY--;}S.calSel=null;render();},
  calNext(){S.calM++;if(S.calM>12){S.calM=1;S.calY++;}S.calSel=null;render();},
  calSelect(d){S.calSel={y:S.calY,m:S.calM,d};S.calCancelConfirm=false;render();},
  calClose(){S.calSel=null;S.calCancelConfirm=false;render();},
  calCancelAsk(){S.calCancelConfirm=true;render();},
  calCancelNo(){S.calCancelConfirm=false;render();},
  calCancelYes(){
    const s=S.calSel;
    if(s)S.cancelled[s.y+'-'+s.m+'-'+s.d]=true;
    S.calCancelConfirm=false;S.calSel=null;render();
  },

  /* 注文履歴のキャンセル */
  histAsk(type,id){if(!id)id='';S.histConfirm={type,id};render();},
  histNo(){S.histConfirm=null;render();},
  histYes(){
    const c=S.histConfirm;
    if(c){
      if(c.type==='all'){S.orders=S.orders.map(o=>({...o,status:'cancelled'}));}
      else{S.orders=S.orders.map(o=>o.id===c.id?{...o,status:'cancelled'}:o);}
    }
    S.histConfirm=null;render();
  },

  /* お気に入り */
  toggleFav(title,series,accent,price){
    const i=S.favs.findIndex(f=>f.title===title);
    if(i>=0)S.favs.splice(i,1);
    else S.favs.push({title,series,accent,price});
    render();
  },
  openFav(i){
    const f=S.favs[i];
    if(f)A._openProduct({title:f.title,seriesName:f.series,accent:f.accent,price:f.price});
  },

  /* 注文確定フロー：もう一品のあと確定し、翌週を案内 */
  orderComplete(){
    if(!S.loggedIn){Login.open();return;}
    if(!S.cartItems.length){return;}
    S.lastChanceOpen=true;S.lastQty=0;render();
  },
  lastQtyChange(d){S.lastQty=Math.max(0,S.lastQty+d);render();},
  finalizeOrder(withExtra){
    if(withExtra&&S.lastQty>0){
      const r=REC[1];
      S.cartItems=[...S.cartItems,{id:'last-'+Date.now(),title:r.title,tag:r.tag,accent:r.tagColor,unit:'',price:toNum(r.price),qty:S.lastQty,week:WEEKS[S.week].label,day:WEEKS[S.week].label,cat:'tanpin'}];
    }
    const disc=cartDiscount();
    const total=cartSubtotal()+cartShip()-disc;
    const pts=coinFor(coinBase());
    S.coins+=pts;
    S.orders=[{id:'o-'+Date.now(),week:WEEKS[S.week].label,count:cartCount(),total,discount:disc,coins:pts,status:'active'},...S.orders];
    S.lastOrder={count:cartCount(),total,discount:disc,coins:pts,week:WEEKS[S.week].label};
    S.cartItems=[];S.lastChanceOpen=false;S.lastQty=0;S.page='orderDone';
    touchCart();render();window.scrollTo(0,0);
  },

  /* 確定お忘れリマインド（閉じてから30秒後に再表示） */
  remindClose(){S.remindOpen=false;touchCart();render();},
  remindGoCart(){S.remindOpen=false;S.page='cart';touchCart();render();},

  openHowto(){S.howtoOpen=true;render();},
  closeHowto(){S.howtoOpen=false;render();},
  openFilter(){S.filterOpen=true;render();},
  closeFilter(){S.filterOpen=false;render();},
  toggleFilter(axis,val){
    const arr=S.filters[axis];const i=arr.indexOf(val);
    if(i>=0)arr.splice(i,1);else arr.push(val);
    render();
  },
  clearFilter(){S.filters={series:[],category:[],kodawari:[]};render();},
  openBulk(){S.bulkOpen=true;render();},
  closeBulk(){S.bulkOpen=false;render();},
  confirmBulk(){
    const now=Date.now();
    const add=wdates(S.week).map(m=>({id:'bulk-'+m.id+'-'+now,title:m.title,tag:'スマイリーミール',accent:'#DB84AC',unit:'2人用',price:toNum(m.price),qty:1,week:WEEKS[S.week].label,day:m.date,cat:'smile'}));
    S.cartItems=[...S.cartItems,...add];S.bulkOpen=false;touchCart();render();
  },

  openSer(wi){
    const cs=SERIES[S.sub.smile]||SERIES[0], m=wdates(S.week)[wi];
    A._openProduct({title:m.title,seriesName:cs.name,accent:cs.accent,price:toNum(m.price),day:m.date});
  },
  openSmile(i){
    const s=SERIES[SMILE[i].si];
    A._openProduct({title:'てりやき親子丼 お揚げと野菜のおかず汁',seriesName:s.name,accent:s.accent,price:1350});
  },
  openMore(i){
    const c=MORE[i];
    A._openProduct({title:c.title,seriesName:c.tag,accent:c.accent,price:toNum(c.price)});
  },
  openGrid(i){
    const cat=CATALOG.find(c=>c.key===S.child);
    const subName=cat.subs[S.sub[cat.key]]||cat.name;
    const it=subItems(subName)[i];
    A._openProduct({title:it.title,seriesName:subName,accent:cat.accent,price:toNum(it.price)});
  },
  openSpecial(id){
    const p=SPECIALS.find(x=>x.id===id);
    if(!p)return;
    if(p.requires&&!cartHasSeries(p.requires))return;  // 条件未達はカード側で誘導
    if(p.limit&&(S.stock[p.id]||0)<=0)return;          // 売り切れ
    A._openProduct({title:p.title,seriesName:'特別販売',accent:'#E0912C',price:p.price,special:true,specialId:p.id,limit:p.limit});
  },
  gotoRequired(){
    /* 条件商品の「対象メニューを見る」：夕食献立のスマイリーミールへ誘導 */
    S.mainTab='dinner';S.child='smile';S.sub.smile=0;S.ddOpen=null;render();window.scrollTo(0,0);
  },
  _openProduct(p){
    S.product={...p,dateLabel:WEEKS[S.week].label+'週 お届け'};
    S.productOpen=true;S.qty={s2:p.special?1:1,s3:0,s4:0};S.cut='on';render();
  },
  closeProduct(){S.productOpen=false;render();},
  changeQty(k,d){
    let v=Math.max(0,S.qty[k]+d);
    const p=S.product||{};
    if(p.special&&p.limit){const st=S.stock[p.specialId]||0;v=Math.min(v,st);}  // 残数を超えない
    S.qty[k]=v;render();
  },
  setCut(v){S.cut=v;render();},
  addToCart(){
    const p=S.product||{};
    const t=S.qty,n=p.special?t.s2:(t.s2+t.s3+t.s4);
    if(n<=0){S.productOpen=false;render();return;}
    const unit=p.special?'':(t.s4?'4人用':(t.s3?'3人用':'2人用'));
    const cutLabel=p.special?'':(S.cut==='on'?'／カットあり':'／カットなし');
    S.cartItems=[...S.cartItems,{id:'add-'+Date.now(),title:p.title||'商品',tag:(p.seriesName||'')+cutLabel,accent:p.accent||'#DB84AC',unit,price:p.price||1350,qty:n,week:WEEKS[S.week].label,day:p.day||WEEKS[S.week].label,cat:p.special?'special':catFor(p.seriesName)}];
    if(p.special&&p.limit){S.stock[p.specialId]=Math.max(0,(S.stock[p.specialId]||0)-n);}
    S.recMode=p.special?'menus':'goods';  // 特別商品のときは通常メニューをレコメンド
    S.productOpen=false;S.cartAddedOpen=true;S.recQty=[0,0,0];touchCart();render();
  },
  recChange(i,d){S.recQty[i]=Math.max(0,S.recQty[i]+d);render();},
  addRec(){
    const now=Date.now();
    let add=[];
    if(S.recMode==='menus'){
      const menus=wdates(S.week).slice(0,3);
      add=menus.map((m,i)=>({m,q:S.recQty[i]})).filter(x=>x.q>0)
        .map(x=>({id:'recm-'+x.m.id+'-'+now,title:x.m.title,tag:'スマイリーミール',accent:'#DB84AC',unit:'2人用',price:toNum(x.m.price),qty:x.q,week:WEEKS[S.week].label,day:x.m.date,cat:'smile'}));
    }else{
      add=REC.map((r,i)=>({r,q:S.recQty[i]})).filter(x=>x.q>0)
        .map(x=>({id:'rec-'+x.r.id+'-'+now,title:x.r.title,tag:x.r.tag,accent:x.r.tagColor,unit:'',price:toNum(x.r.price),qty:x.q,week:WEEKS[S.week].label,day:WEEKS[S.week].label,cat:'tanpin'}));
    }
    S.cartItems=[...S.cartItems,...add];S.cartAddedOpen=false;S.recQty=[0,0,0];touchCart();render();
  },
  skipRec(){S.cartAddedOpen=false;S.recQty=[0,0,0];render();},
  cartQty(id,d){S.cartItems=S.cartItems.map(c=>c.id===id?{...c,qty:Math.max(1,c.qty+d)}:c);touchCart();render();},
  removeCart(id){S.cartItems=S.cartItems.filter(c=>c.id!==id);touchCart();render();},
};
/* カートに指定シリーズのメニューが入っているか（条件付き特別販売の判定） */
function cartHasSeries(name){return S.cartItems.some(c=>(c.tag||'').indexOf(name)>=0);}

/* ================= ファセット絞り込み（ダミー3軸） ================= */
const KODAWARI=['時短','ボリューム','ヘルシー'];
const FILTER_CATS=['主菜','単品','特販'];
/* こだわりはtitleから決定的に割り当て（モックの疑似属性） */
function itemFacet(title,series,category){
  let h=0;for(let i=0;i<(title||'').length;i++)h+=title.charCodeAt(i);
  return {series:series,category:category,kodawari:KODAWARI[h%3]};
}
function passFilter(f){
  const F=S.filters;
  if(F.series.length&&F.series.indexOf(f.series)<0)return false;
  if(F.category.length&&F.category.indexOf(f.category)<0)return false;
  if(F.kodawari.length&&F.kodawari.indexOf(f.kodawari)<0)return false;
  return true;
}
const filterCount=()=>S.filters.series.length+S.filters.category.length+S.filters.kodawari.length;
function emptyFilterHTML(sp){
  return '<div style="padding:'+(sp?'30px 16px':'40px 16px')+';text-align:center;font-size:13px;color:#999;line-height:1.7;">条件に一致する商品がありません。<br>絞り込み条件を変更してください。</div>';
}
const isFav=(title)=>S.favs.some(f=>f.title===title);

/* お気に入りハート（カード右上用・親のクリックを止める） */
function favBtn(title,series,accent,price,sz){
  const args="'"+title+"','"+series+"','"+accent+"',"+price;
  return '<span onclick="event.stopPropagation();A.toggleFav('+args+')" role="button" style="position:absolute;top:8px;right:8px;width:'+(sz||30)+'px;height:'+(sz||30)+'px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;">'+IC.heart(Math.round((sz||30)*0.6),isFav(title))+'</span>';
}

function minusBtnStyle(active,size){
  size=size||29;
  return 'width:'+size+'px;height:'+size+'px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#fff;'
    +'border:'+(active?'1.6px solid #333':'1.6px solid #E4E4E4')+';color:'+(active?'#333':'#DDDDDD')+';';
}
function plusBtn(onclick,size){
  size=size||29;
  return '<button onclick="'+onclick+'" style="width:'+size+'px;height:'+size+'px;border-radius:7px;background:#2b2b2b;color:#fff;display:flex;align-items:center;justify-content:center;">'+IC.plus(Math.round(size*0.48))+'</button>';
}
function tagPill(text,bg){
  return '<span style="align-self:flex-start;padding:3px 11px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;background:'+bg+';white-space:nowrap;">'+text+'</span>';
}

/* eコイン加算見込み表示（商品モーダル用） */
function coinPreviewHTML(){
  const p=S.product||{};
  let selTotal=0;
  if(p.special){selTotal=(S.qty.s2||0)*(p.price||0);}
  else{selTotal=SIZES.reduce((a,s)=>a+(S.qty[s.k]||0)*toNum(s.price),0);}
  /* 追加しようとしている商品が付与対象(smile/more/lovyu)のときだけ対象額に加算 */
  const pcat=p.special?'special':catFor(p.seriesName);
  const selBase=(pcat==='smile'||pcat==='more'||pcat==='lovyu')?selTotal:0;
  const projected=coinFor(coinBase()+selBase);
  const now=coinFor(coinBase());
  const gain=Math.max(0,projected-now);
  return '<div style="display:flex;align-items:center;gap:7px;margin-top:13px;background:#FFF7E8;border-radius:10px;padding:9px 12px;">'
    +'<span style="color:#E0912C;">'+IC.coin(17)+'</span>'
    +(projected>0
      ?'<span style="font-size:12px;color:#7a5c1e;">この追加で <b style="font-size:14px;color:#E0912C;">+'+gain+'pt</b> のeコインが貯まる見込み（対象商品合計'+yen(coinBase()+selBase)+'）</span>'
      :'<span style="font-size:12px;color:#7a5c1e;">eコインは対象商品<b>2,160円以上</b>のご注文で108円ごとに1コイン貯まります（特別販売は対象外）</span>')
    +'</div>';
}

/* 親タブ＋子タブ（ドロップダウン）＋孫タブ */
function tabsBarHTML(sp){
  const salmon='#DB6E62';
  let h='';
  const parent=(key,label)=>{
    const on=S.mainTab===key;
    return '<button onclick="A.setMainTab(\''+key+'\')" style="flex:1;padding:'+(sp?'11px 4px':'13px')+';font-size:'+(sp?'13px':'14.5px')+';font-weight:800;border-radius:12px 12px 0 0;'
      +(on?'background:'+salmon+';color:#fff;':'background:#F6EFE7;color:#8a7a6e;')+'">'+label+'</button>';
  };
  h+='<div style="display:flex;gap:4px;">'+parent('dinner','夕食献立メニュー')+parent('special','特別販売')+'</div>';
  const tabs=S.mainTab==='dinner'?CATALOG:SPECIAL_TABS;
  const activeKey=S.mainTab==='dinner'?S.child:S.specialChild;
  const dd=tabs.find(t=>t.key===S.ddOpen);
  /* 子タブ帯（ドロップダウンは帯の下に重ねて表示＝コンテンツを押し下げない） */
  h+='<div class="dd-anchor">'
    +'<div style="background:'+salmon+';padding:'+(sp?'10px 8px':'12px')+';border-radius:0 0 12px 12px;">'
    +'<div class="hs" style="display:flex;gap:'+(sp?'7px':'10px')+';overflow-x:auto;">'
    +tabs.map(t=>{
      const on=t.key===activeKey;
      return '<button onclick="'+(t.subs.length?'A.toggleDD(\''+t.key+'\')':'A.setChild(\''+t.key+'\')')+'" '
        +'style="flex-shrink:0;'+(sp?'':'flex:1;')+'display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border-radius:6px;padding:'+(sp?'9px 12px':'11px 14px')+';font-size:'+(sp?'12px':'13.5px')+';font-weight:'+(on?'800':'700')+';color:'+(on?'#E50012':'#444')+';box-shadow:0 2px 3px rgba(0,0,0,.15);white-space:nowrap;">'
        +t.name
        +(t.subs.length?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="'+(on?'#E50012':'#b0a89a')+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>':'')
        +'</button>';
    }).join('')
    +'</div></div>';
  if(dd&&dd.subs.length){
    h+='<div class="dd-menu">'
      +dd.subs.map((s,i)=>'<button class="dd-item" onclick="A.setChild(\''+dd.key+'\','+i+')">'+s+'</button>').join('')
      +'</div>';
  }
  h+='</div>';
  return h;
}
/* 特別販売カード（残数表示・条件付き商品対応） */
function specialCardHTML(p,sp){
  const st=p.limit?(S.stock[p.id]||0):null;
  const soldout=p.limit&&st<=0;
  const locked=p.requires&&!cartHasSeries(p.requires);
  let badges='';
  if(p.limit&&!soldout)badges+='<span style="position:absolute;top:8px;left:8px;background:#E50012;color:#fff;font-size:'+(sp?'10px':'11px')+';font-weight:800;padding:3px 9px;border-radius:9px;z-index:2;">売り切れまで残り'+st+'個</span>';
  if(soldout)badges+='<span style="position:absolute;top:8px;left:8px;background:#777;color:#fff;font-size:'+(sp?'10px':'11px')+';font-weight:800;padding:3px 9px;border-radius:9px;z-index:2;">売り切れ</span>';
  if(p.requires&&!locked)badges+='<span style="position:absolute;top:8px;left:8px;background:#4E9265;color:#fff;font-size:'+(sp?'10px':'11px')+';font-weight:800;padding:3px 9px;border-radius:9px;z-index:2;">セット特典・購入OK</span>';
  const imgH=sp?116:130;
  let inner='<div style="position:relative;height:'+imgH+'px;border-radius:8px;overflow:hidden;">'+badges+slot(p.title)
    +(locked||soldout?'<div style="position:absolute;inset:0;background:rgba(255,255,255,.55);"></div>':'')
    +'</div>'
    +'<span style="align-self:flex-start;margin:9px 0 0;padding:3px 11px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;background:#E0912C;">特別販売</span>'
    +'<div style="font-size:'+(sp?'13px':'13.5px')+';font-weight:700;color:'+(locked||soldout?'#9a9a9a':'#2b2b2b')+';line-height:1.4;margin-top:6px;">'+p.title+'</div>'
    +'<div style="font-size:'+(sp?'15px':'16px')+';font-weight:800;color:'+(locked||soldout?'#9a9a9a':'#2b2b2b')+';margin-top:6px;">'+Number(p.price).toLocaleString('ja-JP')+'円</div>';
  if(locked){
    inner+='<div style="margin-top:8px;background:#F6F3EC;border-radius:9px;padding:9px 10px;">'
      +'<div style="display:flex;align-items:flex-start;gap:6px;font-size:'+(sp?'10.5px':'11.5px')+';font-weight:700;color:#8a7a5e;line-height:1.5;"><span style="color:#b0a080;flex-shrink:0;margin-top:1px;">'+IC.lock(14)+'</span>スマイル＆テーブルのメニューを1品以上ご注文いただくと購入できます</div>'
      +'<button onclick="A.gotoRequired()" style="margin-top:7px;width:100%;background:#fff;color:#E50012;font-size:'+(sp?'11px':'12px')+';font-weight:700;padding:8px;border-radius:8px;box-shadow:0 0 0 1.5px #E50012 inset;">対象メニューを見る</button>'
      +'</div>';
  }
  const clickable=!locked&&!soldout;
  return '<div style="text-align:left;display:flex;flex-direction:column;'+(clickable?'cursor:pointer;':'')+'" '+(clickable?'onclick="A.openSpecial(\''+p.id+'\')"':'')+'>'+inner+'</div>';
}

function calDelivery(y,m,d){
  const dow=new Date(y,m-1,d).getDay();
  if(dow===0||dow===6)return null;
  return {menu:WEEK[dow-1],dow};
}

/* カルーセルの挙動（スナップ位置・ドット・自動送り・矢印・ディープリンク）。
   ルート再描画で DOM が作り直されるため、render() の最後に mount() で貼り直す。 */
const Banner=(function(){
  let paused=false, timer=null;
  const list=(key)=>Array.prototype.slice.call(document.querySelectorAll('[data-banner="'+key+'"]'));
  const shown=(el)=>!!el&&el.offsetParent!==null&&el.clientWidth>0;
  const items=(t)=>Array.prototype.slice.call(t.querySelectorAll('.bnr-item'));
  /* いま中央に見えているバナーの位置（実測ベース。CSSの幅指定に依存しない） */
  function index(t){
    const tr=t.getBoundingClientRect(), c=tr.left+tr.width/2;
    let best=0, bd=Infinity;
    items(t).forEach(function(it,i){
      const r=it.getBoundingClientRect(), d=Math.abs(r.left+r.width/2-c);
      if(d<bd){bd=d;best=i;}
    });
    return best;
  }
  /* i番目のバナーを中央に寄せるスクロール位置 */
  function pos(t,i){
    const its=items(t), n=its.length;
    if(!n)return 0;
    const it=its[((i%n)+n)%n];
    const tr=t.getBoundingClientRect(), r=it.getBoundingClientRect();
    return Math.max(0,t.scrollLeft+(r.left-tr.left)-(t.clientWidth-r.width)/2);
  }
  /* ドットインジケーターの現在位置ハイライト */
  function paint(key){
    const t=list(key)[0];
    if(!t)return;
    const i=index(t);
    document.querySelectorAll('[data-dots="'+key+'"] [data-dot]').forEach(function(d){
      const on=Number(d.getAttribute('data-dot'))===i;
      d.style.width=on?'18px':'7px';
      d.style.background=on?'#E50012':'#D8D4CC';
    });
  }
  function move(key,i){
    list(key).forEach(function(t){t.scrollTo({left:pos(t,i),behavior:'smooth'});});
    setTimeout(function(){paint(key);},420);
  }
  /* ユーザー操作（スワイプ・タップ・矢印）で自動送りを停止 */
  function stop(){paused=true;}
  function to(key,i){stop();move(key,i);}
  function nav(key,d){
    stop();
    const t=list(key)[0];
    if(t)move(key,index(t)+d);
  }
  function tick(){
    if(paused)return;
    ['sp','pc'].forEach(function(key){
      const t=list(key)[0];
      if(shown(t))move(key,index(t)+1);
    });
  }
  /* ページ内アンカー：SP/PC 両ルートに同じ節が存在するため、表示中の方だけに id を付ける */
  function anchors(){
    document.querySelectorAll('[data-anchor]').forEach(function(el){
      const name=el.getAttribute('data-anchor');
      if(el.offsetParent!==null)el.id=name;
      else if(el.id===name)el.removeAttribute('id');
    });
  }
  function jump(name){
    const el=Array.prototype.slice.call(document.querySelectorAll('[data-anchor="'+name+'"]'))
      .filter(function(x){return x.offsetParent!==null;})[0];
    if(!el)return false;
    const y=el.getBoundingClientRect().top+window.scrollY-60;
    window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
    return true;
  }
  /* バナーの遷移：'#' 単体＝ダミー／'#xxx'＝ページ内ディープリンク／それ以外＝通常遷移 */
  function go(id){
    const b=BANNERS.filter(function(x){return x.id===id;})[0];
    if(!b)return;
    stop();
    const href=b.href||'#';
    if(href==='#'){toast('準備中のコンテンツです');return;}
    if(href.charAt(0)==='#'){
      const name=href.slice(1);
      if(jump(name))return;
      /* 雑誌型トップにしか無い節（棚など）へのディープリンクは、トップに戻してから移動する */
      if(!S.loggedIn&&S.guestFull){S.guestFull=false;render();if(jump(name))return;}
      toast('準備中のコンテンツです');
      return;
    }
    location.href=href;
  }
  /* 横方向のホイール／トラックパッド操作だけを「スワイプ」とみなす（縦スクロールでは止めない） */
  function onWheel(e){if(Math.abs(e.deltaX)>Math.abs(e.deltaY))stop();}
  /* ウィンドウ幅が変わるとバナー幅も変わりスクロール位置がずれるため、現在のバナーを中央へ再スナップする */
  let rzTimer=null, bound=false;
  function relayout(){
    ['sp','pc'].forEach(function(key){
      const t=list(key)[0];
      if(shown(t))t.scrollTo({left:pos(t,index(t)),behavior:'auto'});
      paint(key);
    });
  }
  function onResize(){clearTimeout(rzTimer);rzTimer=setTimeout(relayout,120);}
  function mount(){
    anchors();
    if(!bound){window.addEventListener('resize',onResize);bound=true;}
    ['sp','pc'].forEach(function(key){
      list(key).forEach(function(t){
        t.addEventListener('scroll',function(){paint(key);},{passive:true});
        t.addEventListener('pointerdown',stop,{passive:true});
        t.addEventListener('touchstart',stop,{passive:true});
        t.addEventListener('wheel',onWheel,{passive:true});
      });
      paint(key);
    });
    if(!timer)timer=setInterval(tick,5000);   /* 5秒で自動送り */
  }
  return {mount:mount,to:to,nav:nav,go:go,jump:jump,stop:stop};
})();

/* ================= LPフッター（lp.html から移植・未ログイン時のみ） =================
   リンク先・文言は lp.html と同一。ログイン済み画面には出さない（呼び出し側で制御）。 */
function lpftIcons(size,names){
  return names.map(function(n){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true"><use href="#ic-'+n+'"></use></svg>';
  }).join('');
}
function lpftExt(){
  return '<svg class="lpft-ext" width="9" height="9" viewBox="0 0 12 12" fill="none" aria-hidden="true">'
    +'<path d="M3.5 8.5 8.5 3.5M4.5 3.5h4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
}
function lpFooterHTML(){
  const navLinks=['お届けメニュー','ご注文','ニュース','よくあるご質問']
    .map(function(t){return '<a href="#top">'+t+'</a>';}).join('');
  const extLink='<a href="#top">xxxxxxxxx'+lpftExt()+'</a>';
  const plainLink='<a href="#top">xxxxxxxxx</a>';
  /* LP と同じ並び：外部リンク3本 → 余白 → 通常リンク3本 → 外部リンク1本 */
  const subLinks=extLink.repeat(3)+'<span class="lpft-gap"></span>'+plainLink.repeat(3)+extLink;
  return '<footer class="lpft" data-section="footer">'
    +'<div class="lpft-inner">'
    +'<div class="lpft-grid">'
    +'<div>'
    +'<div class="lpft-logo"><img src="assets/logo.svg" alt="ヨシケイ楽楽web"></div>'
    +'<div class="lpft-icons">'
    +lpftIcons(34,['carrot','ladle','orange','eggplant','leaf','mushroom','tomato','corn','pea','broccoli','pepper','pot'])
    +'</div>'

    +'<span class="lpft-tel-lbl">'+(regionInfo().key?regionInfo().label+'のお客様':'お問い合わせ（'+regionInfo().label+'）')+'</span>'
    +'<span class="lpft-tel-num">フリーダイヤル '+regionInfo().tel+'</span>'
    +'</div></div>'
    +'<div class="lpft-nav">'+navLinks+'</div>'
    +'<div class="lpft-sub">'+subLinks+'</div>'

    +'<div class="lpft-bottom">'
    +'<div class="lpft-icons2">'

    +'</div>'
    +'<div class="lpft-meta">'
    +'<span class="lpft-copy">© 2026 Yoshikei All rights reserved.</span>'
    +'<span class="lpft-sns">'
    +'<a href="#top" class="lpft-line" aria-label="LINE">L</a>'
    +'<a href="#top" class="lpft-dark" aria-label="Instagram"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="1.8"></rect><circle cx="12" cy="12" r="4" stroke="#fff" stroke-width="1.8"></circle><circle cx="17" cy="7" r="1.3" fill="#fff"></circle></svg></a>'

/* ================= レンダリング（スクロール位置保持付き） ================= */
function render(){
  const winY=window.scrollY;
  const saved={};
  document.querySelectorAll('[data-sc]').forEach(el=>{
    saved[el.getAttribute('data-sc')]={top:el.scrollTop,left:el.scrollLeft};
  });
  document.getElementById('sp-root').innerHTML=spHTML();
  document.getElementById('pc-root').innerHTML=pcHTML();
  document.querySelectorAll('[data-sc]').forEach(el=>{
    const s=saved[el.getAttribute('data-sc')];
    if(s){el.scrollTop=s.top;el.scrollLeft=s.left;}
  });
  window.scrollTo(0,winY);
  Banner.mount();   /* カルーセルのイベント再バインド＋表示中ルートへのアンカー付与 */
}

      +'<p style="font-size:12.5px;color:#999;line-height:1.8;margin:16px 0 0;">ご不明な場合はフリーダイヤル '+regionInfo().tel+' へお問い合わせください</p>'
      +'<div style="text-align:center;margin-top:22px;"><button data-zip-retry style="border:none;background:transparent;color:#999;font-size:13px;font-weight:700;text-decoration:underline;">郵便番号を入力し直す</button></div>'
      +'</div>';
  }
  function checkZip(){
    if(zipValue.length!==7)return;
    const area=findArea(zipValue);
    area_state.zip=zipValue;
    area_state.office=area?area.office:null;
    area_state.region=area?area.region:null;
    if(area){
      S.office=area.office;
      setRegion(area.region);   // 以降の画面（フッター・問い合わせ・支払方法・eコイン上限）は REGION を参照する
      phase='zipOk';
      renderStep();
      render();
    }else{
      phase='zipNg';
      renderStep();
    }
  }

  function renderStep(){
    if(phase==='zip'){renderZip();return;}
    if(phase==='zipOk'){renderZipOk();return;}
    if(phase==='zipNg'){renderZipNg();return;}
    if(phase==='done'){renderDone();return;}
    const body=$('[data-onboard-body]'),bar=$('[data-onboard-bar]'),lbl=$('[data-onboard-step]');
    if(step<7){
      const Q=QUESTIONS[step];
      bar.style.width=((step+1)/7*100)+'%';
      lbl.textContent=(step+1)+' / 7';
      const sel=answers[Q.key]||(Q.multi?[]:null);
      const opts=Q.opts.map(o=>{
        const on=Q.multi?(sel.indexOf(o)>=0):(sel===o);
        return '<button data-opt="'+o+'" style="display:block;width:100%;text-align:left;border:2px solid '+(on?'#E50012':'#e2ded7')+';background:'+(on?'#fdf0f1':'#fff')+';color:'+(on?'#E50012':'#444')+';font-size:16px;font-weight:700;padding:16px 18px;border-radius:14px;margin-bottom:12px;">'+o+'</button>';
      }).join('');
      let footer='';
      const answered=Q.multi?(sel&&sel.length):(sel!==null&&sel!==undefined);
      if(Q.multi||answered){footer+='<button data-onboard-next style="width:100%;border:none;background:#E50012;color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:12px;margin-top:6px;">次へ</button>';}
      if(!Q.noSkip){footer+='<div style="text-align:center;margin-top:14px;"><button data-onboard-skip style="border:none;background:transparent;color:#999;font-size:13px;font-weight:700;text-decoration:underline;">あとで設定する</button></div>';}
      if(step>=1){footer+='<div style="text-align:center;margin-top:18px;"><button data-onboard-back style="border:none;background:transparent;color:#999;font-size:13px;font-weight:700;">← 前の質問に戻る</button></div>';}
      body.innerHTML='<div style="max-width:460px;margin:0 auto;">'
        +'<div class="onboard-q-title"><span>'+Q.q+'</span></div>'
        +'<img class="onboard-illust" src="'+(ILLUSTS[step]||'')+'" alt="">'
        +opts+footer+'</div>';
    }else{
      renderSignup();
    }
  }

  /* 家族人数の初期値：質問1（何人分）から転記 */
  function familyDefault(){
    const sv=answers.serving;
    if(sv==='2人分')return {adult:2,child:0};
    if(sv==='3人分')return {adult:2,child:1};
    return {adult:2,child:2};
  }

  /* B. 仮登録フォーム画面（KOKYAKU対応を意識した本人情報入力） */
  function renderSignup(){
    const body=$('[data-onboard-body]'),bar=$('[data-onboard-bar]'),lbl=$('[data-onboard-step]');
    bar.style.width='100%';
    lbl.textContent='仮登録';
    const ist='width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:16px;font-family:inherit;box-sizing:border-box;';
    const lab=(t,req)=>'<div style="font-size:13px;font-weight:700;color:#555;margin:14px 0 6px;">'+t+(req?'<span style="color:#E50012;"> *</span>':'<span style="color:#aaa;font-weight:600;font-size:12px;"> （任意）</span>')+'</div>';
    const fam=familyDefault();
    const numOpts=(sel)=>{let o='';for(let i=0;i<=8;i++){o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+'人</option>';}return o;};
    body.innerHTML='<div style="max-width:460px;margin:0 auto;text-align:left;">'
      +'<div class="onboard-q-title" style="text-align:left;"><span>お届けに必要な情報をご入力ください</span></div>'
      +lab('お名前',true)+'<input data-su-name type="text" placeholder="山田 太郎" style="'+ist+'">'
      +lab('フリガナ',true)+'<input data-su-kana type="text" placeholder="ヤマダ タロウ" style="'+ist+'">'
      +lab('郵便番号',true)+'<input data-su-zip type="text" inputmode="numeric" value="'+(area_state.zip||'')+'" style="'+ist+'">'
      +lab('ご住所',true)+'<input data-su-addr type="text" placeholder="市区町村・番地" style="'+ist+'">'
      +lab('電話番号',true)+'<input data-su-tel type="tel" inputmode="numeric" placeholder="09012345678" style="'+ist+'"><div style="font-size:11.5px;color:#999;margin-top:5px;">ご本人確認とお届けのご連絡に使用します</div>'
      +lab('メールアドレス',true)+'<input data-su-email type="email" placeholder="you@example.com" style="'+ist+'">'
      +lab('パスワード',true)+'<input data-su-pass type="password" placeholder="8文字以上" style="'+ist+'">'
      +lab('生年月日',false)+'<input data-su-birth type="date" style="'+ist+'">'
      +lab('ご家族の人数',false)
      +'<div style="display:flex;gap:12px;">'
        +'<div style="flex:1;"><div style="font-size:12px;color:#888;margin-bottom:4px;">大人</div><select data-su-adult style="'+ist+'">'+numOpts(fam.adult)+'</select></div>'
        +'<div style="flex:1;"><div style="font-size:12px;color:#888;margin-bottom:4px;">子ども</div><select data-su-child style="'+ist+'">'+numOpts(fam.child)+'</select></div>'
      +'</div>'
      +lab('ご紹介者コード',false)+'<input data-su-ref type="text" inputmode="numeric" maxlength="6" placeholder="6桁" style="'+ist+'">'
      +'<button data-su-submit style="width:100%;border:none;background:#E50012;color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:12px;margin-top:22px;">仮登録する</button>'
      +'<div style="text-align:center;margin-top:16px;"><button data-su-back style="border:none;background:transparent;color:#999;font-size:13px;font-weight:700;">← 前の質問に戻る</button></div>'
      +'</div>';
  }

  function submitSignup(){
    const req=[['[data-su-name]','お名前'],['[data-su-kana]','フリガナ'],['[data-su-zip]','郵便番号'],['[data-su-addr]','ご住所'],['[data-su-tel]','電話番号'],['[data-su-email]','メールアドレス'],['[data-su-pass]','パスワード']];
    for(let i=0;i<req.length;i++){
      const el=$(req[i][0]);
      if(!el||!el.value.trim()){alert(req[i][1]+'をご入力ください');if(el)el.focus();return;}
    }
    const nm=$('[data-su-name]');
    regName=(nm&&nm.value.trim())||'会員';
    phase='done';renderStep();
  }

  /* C. 受付番号発行完了画面 */
  function renderDone(){
    const body=$('[data-onboard-body]'),bar=$('[data-onboard-bar]'),lbl=$('[data-onboard-step]');
    bar.style.width='100%';
    lbl.textContent='仮登録完了';
    body.innerHTML='<div style="max-width:460px;margin:0 auto;text-align:center;">'
      +'<div style="width:56px;height:56px;margin:8px auto 18px;border-radius:50%;background:#E50012;display:flex;align-items:center;justify-content:center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4.5 12.5l5 5 10-11" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
      +'<div style="font-size:22px;font-weight:800;color:#3a3a3a;margin-bottom:22px;">仮登録が完了しました</div>'
      +'<div style="font-size:13px;color:#888;margin-bottom:6px;">受付番号</div>'
      +'<div style="font-size:30px;font-weight:800;color:#E50012;letter-spacing:.06em;margin-bottom:24px;">R-260730-001</div>'
      +'<p style="font-size:13.5px;color:#666;line-height:1.95;margin:0 0 26px;">担当営業所で確認後、本登録のご案内をお送りします<br>いまから仮のご注文が可能です。お届けは本登録完了後に確定します</p>'
      +'<button data-su-menu style="width:100%;border:none;background:#E50012;color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:12px;">メニューを見る</button>'
      +'</div>';
  }
  function single(v){answers[QUESTIONS[step].key]=v;step++;renderStep();}
  function toggle(v){
    const Q=QUESTIONS[step];let arr=answers[Q.key]||[];
    if(Q.key==='allergens'&&v==='なし'){arr=['なし'];}
    else{
      const i=arr.indexOf(v);
      if(i>=0)arr.splice(i,1);
      else{arr.push(v);const ni=arr.indexOf('なし');if(ni>=0)arr.splice(ni,1);}
    }
    answers[Q.key]=arr;renderStep();
  }
  function next(){const Q=QUESTIONS[step];if(Q.noSkip){const arr=answers[Q.key]||[];if(!arr.length)return;}step++;renderStep();}
  function back(){if(step>0){step--;renderStep();}}

  function buildProfile(name){
    taste_profile.user_name=name;
    const sv=answers.serving;
    taste_profile.serving=sv==='2人分'?2:sv==='3人分'?3:sv==='4人分以上'?4:null;
    taste_profile.taste_weights=TASTE_WEIGHTS[answers.taste]||{};
    const gw={};(answers.genre||[]).forEach(g=>{if(GENRE_MAP[g])gw[GENRE_MAP[g]]=1.0;});
    taste_profile.genre_weights=gw;
    taste_profile.cook_time=answers.cook_time||null;
    taste_profile.health=(answers.health&&answers.health!=='特になし')?answers.health:null;
    let al=[];(answers.allergens||[]).forEach(a=>{if(ALLERGEN_MAP[a])al=al.concat(ALLERGEN_MAP[a]);});
    taste_profile.allergens=al;
    taste_profile.preferred_days=answers.preferred_days||null;
  }

  // ログイン成立でサイト本体へ（PC/SP共通の状態を更新。表示中ページは維持）
  function completeLogin(name){
    S.loggedIn=true;S.userName=name;render();
    try{history.replaceState(null,'',location.pathname);}catch(e){}
    try{console.log('[login_flow] taste_profile =',taste_profile);}catch(e){}
  }

  function doEmailLogin(){
    const em=$('[data-login-email]');
    if(!em||!em.value.trim()){if(em)em.focus();return;}
    taste_profile.user_name='会員';
    close();
    completeLogin('会員');
  }

  function finish(){
    const name=regName||'会員';
    buildProfile(name);
    playWelcome(name);
  }

  // ようこそ演出：名前表示のあと赤い円の拡大トランジションでサイト本体へ
  function playWelcome(name){
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ob=$('[data-onboard-overlay]');
    const removeOverlay=()=>{if(ob)ob.style.display='none';};

    const wel=document.createElement('div');
    wel.style.cssText='position:fixed;inset:0;z-index:1000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;transition:opacity .4s ease;';
    wel.innerHTML='<div style="font-size:24px;font-weight:700;color:#3a3a3a;line-height:1.8;">'+name+'さん、ようこそ。</div>'
      +'<div style="font-size:24px;font-weight:700;color:#3a3a3a;line-height:1.8;">お楽しみください。</div>';
    document.body.appendChild(wel);
    requestAnimationFrame(()=>{wel.style.opacity='1';});

    if(reduce){
      setTimeout(()=>{
        removeOverlay();
        if(wel.parentNode)wel.parentNode.removeChild(wel);
        completeLogin(name);
      },1400);
      return;
    }

    setTimeout(()=>{
      const circle=document.createElement('div');
      const dia=Math.ceil(Math.sqrt(window.innerWidth*window.innerWidth+window.innerHeight*window.innerHeight));
      const size=dia*2.4;
      circle.style.cssText='position:fixed;top:50%;left:50%;width:'+size+'px;height:'+size+'px;margin:'+(-size/2)+'px 0 0 '+(-size/2)+'px;border-radius:50%;background:#E50012;z-index:1001;transform:scale('+(20/size)+');transition:transform .6s ease-in;';
      document.body.appendChild(circle);
      requestAnimationFrame(()=>{circle.style.transform='scale(1)';});
      setTimeout(()=>{
        removeOverlay();
        if(wel.parentNode)wel.parentNode.removeChild(wel);
        completeLogin(name);
        circle.style.transition='opacity .5s ease';
        circle.style.opacity='0';
        setTimeout(()=>{if(circle.parentNode)circle.parentNode.removeChild(circle);},520);
      },620);
    },1400);
  }

  /* イベント配線（オーバーレイは再描画対象外の静的DOM） */
  const lo=$('[data-login-overlay]');
  lo.addEventListener('click',e=>{
    /* 閉じるだけ：未ログインでもゲスト閲覧を続けられるようLPへは戻さない */
    if(e.target===lo||e.target.closest('[data-login-close]')){close();return;}
    if(e.target.closest('[data-login-submit]')){doEmailLogin();return;}
    if(e.target.closest('[data-onboard-start]')){close();startOnboard();return;}
  });
  const ob=$('[data-onboard-overlay]');
  // 郵便番号入力：ハイフン等は自動除去し数字7桁に整形（再描画せず値だけ整形＝フォーカス維持）
  ob.addEventListener('input',e=>{
    const z=e.target.closest('[data-zip-input]');
    if(!z)return;
    const v=z.value.replace(/[^0-9]/g,'').slice(0,7);
    if(z.value!==v)z.value=v;
    zipValue=v;
    const btn=$('[data-zip-check]');
    if(btn){
      const on=v.length===7;
      btn.disabled=!on;
      btn.style.background=on?'#E50012':'#e0dcd5';
      btn.style.cursor=on?'pointer':'default';
    }
  });
  ob.addEventListener('click',e=>{
    /* 仮登録フローを閉じたらゲスト閲覧に戻る（ログイン導線はヘッダーから再度たどれる） */
    if(e.target.closest('[data-onboard-close]')){ob.style.display='none';return;}
    if(e.target.closest('[data-zip-check]')){checkZip();return;}
    if(e.target.closest('[data-zip-next]')){phase='questions';step=0;renderStep();return;}
    if(e.target.closest('[data-zip-retry]')){phase='zip';renderStep();return;}
    if(e.target.closest('[data-zip-find]')){e.preventDefault();return;}
    const opt=e.target.closest('[data-opt]');
    if(opt){const Q=QUESTIONS[step];if(Q.multi)toggle(opt.getAttribute('data-opt'));else single(opt.getAttribute('data-opt'));return;}
    if(e.target.closest('[data-onboard-next]')){next();return;}
    if(e.target.closest('[data-onboard-skip]')){step++;renderStep();return;}
    if(e.target.closest('[data-onboard-back]')){back();return;}
    if(e.target.closest('[data-su-back]')){phase='questions';step=6;renderStep();return;}
    if(e.target.closest('[data-su-submit]')){submitSignup();return;}
    if(e.target.closest('[data-su-menu]')){finish();return;}
  });

  // signup：ヘッダーの「はじめての方」から仮登録フローを直接起動する
  return {open,signup:startOnboard};
})();

/* ================= 検索（商品名・カテゴリ） ================= */
const Search=(function(){
  let results=[];
  const ov=()=>document.querySelector('[data-search-overlay]');
  function dataset(){
    const ds=[];
    wdates(S.week).forEach(m=>ds.push({kind:'menu',title:m.title,cat:'夕食献立メニュー／スマイリーミール',price:toNum(m.price),accent:'#DB84AC',series:'スマイリーミール'}));
    MORE.forEach(c=>ds.push({kind:'menu',title:c.title,cat:'＆more／'+c.tag,price:toNum(c.price),accent:c.accent,series:c.tag}));
    REC.forEach(r=>ds.push({kind:'menu',title:r.title,cat:r.tag,price:toNum(r.price),accent:r.tagColor,series:r.tag}));
    CATALOG.forEach(c=>c.subs.forEach(sname=>subItems(sname).forEach(it=>ds.push({kind:'menu',title:it.title,cat:c.name+'／'+sname,price:toNum(it.price),accent:c.accent,series:sname}))));
    SPECIALS.forEach(p=>ds.push({kind:'special',id:p.id,title:p.title,cat:'特別販売',price:p.price,accent:'#E0912C',series:'特別販売'}));
    return ds;
  }
  function renderResults(q){
    const box=document.querySelector('[data-search-results]');
    q=(q||'').trim();
    if(!q){box.innerHTML='<div style="padding:26px;text-align:center;font-size:12.5px;color:#999;">商品名やカテゴリ名を入力してください</div>';results=[];return;}
    results=dataset().filter(d=>d.title.indexOf(q)>=0||d.cat.indexOf(q)>=0).slice(0,30);
    if(!results.length){box.innerHTML='<div style="padding:26px;text-align:center;font-size:12.5px;color:#999;">「'+q+'」に一致する商品が見つかりませんでした</div>';return;}
    box.innerHTML=results.map((d,i)=>'<div onclick="Search.pick('+i+')" style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #F4F4F4;cursor:pointer;">'
      +'<div style="width:54px;height:44px;border-radius:7px;overflow:hidden;flex-shrink:0;">'+slot(d.title)+'</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="font-size:10.5px;color:#999;">'+d.cat+'</div>'
      +'<div style="font-size:13px;font-weight:700;color:#2b2b2b;margin-top:2px;">'+d.title+'</div>'
      +'</div>'
      +'<span style="font-size:13.5px;font-weight:800;color:#2b2b2b;flex-shrink:0;">'+Number(d.price).toLocaleString('ja-JP')+'円</span>'
      +'</div>').join('');
  }
  function open(){
    ov().style.display='flex';
    const inp=document.querySelector('[data-search-input]');
    inp.value='';renderResults('');
    setTimeout(()=>inp.focus(),60);
  }
  function close(){ov().style.display='none';}
  function pick(i){
    const d=results[i];if(!d)return;
    close();
    if(d.kind==='special'){A.openSpecial(d.id);}
    else{A._openProduct({title:d.title,seriesName:d.series,accent:d.accent,price:d.price});}
  }
  document.querySelector('[data-search-input]').addEventListener('input',e=>renderResults(e.target.value));
  ov().addEventListener('click',e=>{if(e.target===ov()||e.target.closest('[data-search-close]'))close();});
  return {open,close,pick};
})();

/* ================= 確定お忘れリマインド（カート放置30秒ごとに表示） =================
   ※ 暫定ルール：30秒に1回。今後は画面遷移等をトリガーにルール化予定 */
setInterval(()=>{
  if(S.cartItems.length&&S.page!=='cart'
     &&!S.productOpen&&!S.cartAddedOpen&&!S.lastChanceOpen&&!S.remindOpen&&!S.bulkOpen
     &&Date.now()-lastCartChange>30000){
    S.remindOpen=true;touchCart();render();
  }
},3000);

render();

/* 本体（index.html）はゲスト閲覧に対応したECトップ。
   - 未ログインでもリダイレクトせず注文TOPを表示する（ヒーロー＋ログイン導線を出す）
   - LP（lp.html）から ?login=1 で遷移したときだけログインモーダルを自動表示
   - マイページ・注文確定など会員限定の操作は各アクションの Login.open() ガードで止める */
try{
  if(new URLSearchParams(location.search).has('login')&&!S.loggedIn){
    setTimeout(function(){Login.open();},450);
  }
}catch(e){}
