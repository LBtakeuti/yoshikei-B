<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヨシケイ楽楽web モック（PC/SP統合）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:#ECECEC;font-family:'Zen Kaku Gothic New',sans-serif;}
  a{color:#E50012;text-decoration:none;}
  a:hover{color:#B10010;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;margin:0;}
  .hs{scrollbar-width:none;}
  .hs::-webkit-scrollbar{display:none;}
  .ps::-webkit-scrollbar{width:8px;height:8px;}
  .ps::-webkit-scrollbar-thumb{background:#D6D6D6;border-radius:4px;}
  @keyframes rk-up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes rk-fade{from{opacity:0;}to{opacity:1;}}
  @keyframes rk-pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes rk-slide{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
  /* 子タブのドロップダウン（コンテンツに覆いかぶさるオーバーレイ） */
  .dd-anchor{position:relative;}
  .dd-menu{
    position:absolute;left:8px;right:8px;top:100%;margin-top:6px;z-index:60;
    background:#CE5C50;border-radius:12px;overflow:hidden;
    box-shadow:0 14px 34px rgba(0,0,0,.30);
    animation:dd-open .18s ease;transform-origin:top center;
  }
  @keyframes dd-open{from{opacity:0;transform:translateY(-8px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
  .dd-item{display:block;width:100%;padding:13px 18px;color:#fff;font-size:13.5px;font-weight:700;text-align:center;white-space:nowrap;transition:background .12s ease;}
  .dd-item+.dd-item{border-top:1px solid rgba(255,255,255,.45);}
  .dd-item:hover{background:rgba(255,255,255,.16);}
  /* ログインフロー（yoshikei-login-flow.html より移植） */
  .onboard-illust{display:block;margin:6px auto 22px;height:110px;max-width:70vw;width:auto;}
  .onboard-q-title{font-size:22px;font-weight:700;color:#3a3a3a;line-height:1.5;margin-bottom:8px;min-height:66px;display:flex;align-items:flex-start;}
  .tk-btn{position:relative;overflow:hidden;transition:color .3s ease;}
  .tk-btn>span{position:relative;z-index:1;}
  .tk-btn::before{content:'';position:absolute;inset:0;background:#E50012;transform:scale(.97);opacity:0;transition:transform .3s ease,opacity .3s ease;z-index:0;}
  .tk-btn:hover::before{transform:scale(1);opacity:1;}
  .tk-btn:hover>span{color:#fff;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
  }
  /* PC / SP 切り替え（1024px） */
  #pc-root{display:none;}
  #sp-root{display:block;}
  @media (min-width:1024px){
    #pc-root{display:block;}
    #sp-root{display:none;}
  }
</style>
</head>
<body>
<div id="sp-root"></div>
<div id="pc-root"></div>

<!-- ======== ログインモーダル（PC/SP共通・参照: yoshikei-login-flow.html） ======== -->
<div data-login-overlay style="position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:20px;max-width:400px;width:100%;padding:30px 26px;position:relative;text-align:center;">
    <button data-login-close aria-label="閉じる" style="position:absolute;top:14px;right:14px;width:30px;height:30px;border:none;border-radius:50%;background:#f2efea;color:#666;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;">×</button>
    <img src="assets/logo.svg" alt="ヨシケイ楽楽web" style="height:30px;width:auto;display:block;margin:0 auto 18px;">
    <div style="font-size:20px;font-weight:700;color:#3a3a3a;margin-bottom:20px;">ログイン / はじめての方</div>
    <input data-login-email type="email" placeholder="メールアドレス" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;margin-bottom:12px;">
    <button data-login-submit class="tk-btn" style="width:100%;border:none;background:#E50012;color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:12px;"><span>ログイン</span></button>
    <div style="display:flex;align-items:center;gap:12px;margin:22px 0 16px;"><span style="flex:1;height:1px;background:#eee;"></span><span style="font-size:12px;color:#999;font-weight:700;">はじめての方</span><span style="flex:1;height:1px;background:#eee;"></span></div>
    <button data-onboard-start style="width:100%;border:2px solid #E50012;background:#fff;color:#E50012;font-size:15px;font-weight:700;padding:13px;border-radius:12px;">無料ではじめる（かんたん7つの質問）</button>
  </div>
</div>

<!-- ======== オンボーディング（7つの質問） ======== -->
<div data-onboard-overlay style="position:fixed;inset:0;z-index:500;background:#fff;display:none;flex-direction:column;">
  <div style="flex:none;padding:18px 20px 0;max-width:560px;margin:0 auto;width:100%;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-weight:800;font-size:15px;color:#E50012;letter-spacing:.04em;">Welcome</div>
      <button data-onboard-close aria-label="閉じる" style="width:30px;height:30px;border:none;border-radius:50%;background:#f2efea;color:#666;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;">×</button>
    </div>
    <div style="height:6px;border-radius:3px;background:#f0ede8;overflow:hidden;"><div data-onboard-bar style="height:100%;width:0;background:#E50012;transition:width .35s ease;"></div></div>
    <div data-onboard-step style="font-size:12px;color:#999;font-weight:700;margin-top:8px;text-align:center;">1 / 7</div>
  </div>
  <div data-onboard-body style="flex:1;overflow-y:auto;padding:24px 20px 40px;max-width:560px;margin:0 auto;width:100%;"></div>
</div>

<!-- ======== 検索オーバーレイ（商品名・カテゴリ検索／PC・SP共通） ======== -->
<div data-search-overlay style="position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:22px 14px;">
  <div style="width:100%;max-width:560px;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;max-height:82vh;box-shadow:0 24px 60px rgba(0,0,0,.35);">
    <div style="display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #EEE;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input data-search-input type="text" placeholder="商品名・カテゴリで検索（例：親子丼、カットミール）" style="flex:1;border:none;outline:none;font-size:14px;font-family:inherit;color:#333;min-width:0;">
      <button data-search-close style="width:28px;height:28px;border-radius:50%;background:#F2EFEA;color:#666;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;">×</button>
    </div>
    <div data-search-results class="ps" style="flex:1;overflow-y:auto;"></div>
  </div>
</div>

<script>
/* ================= 共通データ ================= */
const SERIES=[
  {key:'smile',    name:'スマイリーミール',   accent:'#DB84AC', dark:'#B85688', tint:'#FBEEF3'},
  {key:'standard', name:'スタンダードミール', accent:'#6FA8D6', dark:'#3E7CB1', tint:'#EBF3FA'},
  {key:'balance',  name:'バランスミール',     accent:'#7FBB8C', dark:'#4E9265', tint:'#EEF6F0'},
  {key:'cut',      name:'カットミール',       accent:'#5FB8B0', dark:'#3E8E87', tint:'#EAF5F4'},
  {key:'fun',      name:'ファンミール',       accent:'#DDA92C', dark:'#B2851A', tint:'#FBF3DE'},
  {key:'timely',   name:'タイムリーミール',   accent:'#A98BC7', dark:'#8663AC', tint:'#F2ECF8'},
];
/* 注文可能な週（販売は2週間分のみ・同一画面で切り替えて注文可） */
const WEEKS=[
  {label:'5/11',deadline:'5/1'},
  {label:'5/18',deadline:'5/8'},
];
/* タブカタログ：親タブ（夕食献立メニュー／特別販売）＞子タブ＞孫タブ */
const CATALOG=[
  {key:'smile', name:'Smile＆table',   accent:'#DB84AC', subs:SERIES.map(s=>s.name)},
  {key:'more',  name:'＆more',         accent:'#CE4A3E', subs:['プレミアムディッシュ','カジュアルディッシュ']},
  {key:'lovyu', name:'Lovyu',          accent:'#7B6FC2', subs:['バリエーションダイニング','クイックダイニング']},
  {key:'tanpin',name:'単品・冷凍食品', accent:'#4FA98C', subs:['シンプルミール','ベジミール','フリーセット','人気セレクション','コレdo!-2','コレdo!-3','コレdo!-4','ヨシケイセレクト','特集']},
];
const SPECIAL_TABS=[
  {key:'benri', name:'便利品＆7月デリシャス', accent:'#E0912C', subs:[]},
  {key:'asa',   name:'朝食・お米・お買い得品', accent:'#7BA86A', subs:['朝食','レトルトごはん']},
];
/* 特別販売商品：limit=個数制限（残数表示）／requires=特定メニュー購入が条件 */
const SPECIALS=[
  {id:'sp1',cat:'benri',sub:null,title:'国産うなぎ蒲焼 2尾セット【数量限定】',price:2980,limit:true},
  {id:'sp2',cat:'benri',sub:null,title:'7月デリシャス 夏の果物詰め合わせ',price:1980},
  {id:'sp3',cat:'benri',sub:null,title:'プレミアムデザート 杏仁豆腐4個入',price:680,requires:'スマイリーミール'},
  {id:'sp4',cat:'asa',sub:'朝食',title:'朝食パン＆スープセット',price:880},
  {id:'sp5',cat:'asa',sub:'レトルトごはん',title:'レトルトごはん 10食パック',price:1580},
];
/* eコイン：2,160円以上の購入で100円につき1pt */
const COIN_MIN=2160;
const coinFor=(total)=>total>=COIN_MIN?Math.floor(total/100):0;
/* 週ごとの献立（モック：日付を週に合わせて生成） */
function wdates(wi){return WEEK.map((m,i)=>({...m,date:'5/'+(11+wi*7+i)}));}
function weekDays(wi){return ['月','火','水','木','金','土'].map((d,i)=>({n:String(11+wi*7+i),dow:d}));}
/* 子タブ（孫なしのグリッド用）の商品生成 */
function subItems(subName){
  return [1,2,3,4].map(i=>({title:subName+' おすすめセット'+i,price:'1,280'}));
}
const WEEK=[
  {id:'d11',date:'5/11',dow:'月',title:'てりやき親子丼 お揚げと野菜のおかず汁',price:'1,350'},
  {id:'d12',date:'5/12',dow:'火',title:'豚肉のすりおろし生姜焼き かぼちゃサラダ',price:'1,290'},
  {id:'d13',date:'5/13',dow:'水',title:'バターじょうゆで食べる骨取あじのムニエル ウインナーと野菜のミルクスープ',price:'1,580'},
  {id:'d14',date:'5/14',dow:'木',title:'揚げない黒酢酢豚 レンチン蒸し鶏の棒々鶏',price:'1,420'},
  {id:'d15',date:'5/15',dow:'金',title:'おろしチキン竜田 ツナとわかめのあえもの',price:'1,380'},
];
const SMILE=[{id:'a',si:0},{id:'b',si:1},{id:'c',si:4},{id:'d',si:5}];
const MORE=[
  {id:'m1',tag:'プレミアムディッシュ',accent:'#CE4A3E',title:'ハンバーグ〜オニオンバターソース〜',price:'1,350'},
  {id:'m2',tag:'カジュアルディッシュ',accent:'#4FA98C',title:'鶏肉とポテトの塩レモン',price:'1,350'},
];
const SIZES=[{k:'s2',label:'2人用',price:'1,350'},{k:'s3',label:'3人用',price:'1,690'},{k:'s4',label:'4人用',price:'2,150'}];
const REC=[
  {id:'r1',tag:'食料雑貨',tagColor:'#8FC24A',date:'5/11（月）お届け',title:'神戸ドーナツ プレーン・夏みかん＋キャラメル',short:'ドーナツ',price:'1,490'},
  {id:'r2',tag:'食料雑貨',tagColor:'#8FC24A',date:'5/11（月）お届け',title:'大地の恵みナッツ＆フルーツ',short:'ナッツ',price:'1,060'},
  {id:'r3',tag:'お米',tagColor:'#7B6FC2',date:'5/11（月）お届け',title:'レトルトご飯',short:'ご飯',price:'650'},
];
const NEWS=[
  {tag:'重要',color:'#E50012',date:'xxxx.xx.xx',title:'xxxxxxxxxxxxxxxxxxxxxxxxxxxx',unread:true},
  {tag:'メンテナンス',color:'#6F86C2',date:'xxxx.xx.xx',title:'xxxxxxxxxxxxxxxxxxxx',unread:true},
  {tag:'キャンペーン',color:'#E0912C',date:'xxxx.xx.xx',title:'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx',unread:true},
  {tag:'お知らせ',color:'#7BA86A',date:'xxxx.xx.xx',title:'xxxxxxxxxxxxxxxx',unread:false},
  {tag:'お知らせ',color:'#7BA86A',date:'xxxx.xx.xx',title:'xxxxxxxxxxxxxxxxxxxxxx',unread:false},
];
const FAQ=['xxxxxxxxxxxxxxxxxxxxxx？','xxxxxxxxxxxxxx？','xxxxxxxxxxxxxxxxxxxxxxxxxx？','xxxxxxxxxxxx？','xxxxxxxxxxxxxxxxxx？'];
const HELPCATS=[
  {i:'注',name:'ご注文について'},{i:'配',name:'お届けについて'},{i:'払',name:'お支払い'},
  {i:'会',name:'会員情報'},{i:'定',name:'定期便'},{i:'他',name:'その他'},
];

/* ================= 状態（PC/SP共通） ================= */
const _now=new Date();
let S={
  loggedIn:false, userName:null, lastOrder:null,
  coins:120,                        // eコイン残高（モック初期値）
  week:0,                           // 選択中の注文週（WEEKS のindex）
  mainTab:'dinner',                 // dinner=夕食献立メニュー | special=特別販売
  child:'smile',                    // 夕食献立の子タブ（CATALOG key）
  specialChild:'benri',             // 特別販売の子タブ
  sub:{smile:0,more:0,lovyu:0,tanpin:0,asa:-1},  // 各子タブの孫タブ選択
  ddOpen:null,                      // 開いているドロップダウン（子タブkey）
  favs:[],                          // お気に入りメニュー
  orders:[{id:'o1',week:'5/4',count:5,total:6890,coins:68,status:'active'}], // 注文履歴
  histConfirm:null,                 // 履歴キャンセル確認 {type:'one'|'all',id}
  stock:{sp1:7},                    // 特別販売の残数
  cancelled:{},                     // カレンダー：キャンセル済みの日 'y-m-d'
  calCancelConfirm:false,           // カレンダー：キャンセル警告モーダル
  lastChanceOpen:false, lastQty:0,  // 注文確定時の「もう一品いかがですか」
  remindOpen:false,                 // 確定お忘れリマインド
  recMode:'goods',                  // カート追加後レコメンド：goods=雑貨 | menus=通常メニュー
  cut:'on',                         // カットあり(on)／カットなし(off)
  calY:_now.getFullYear(), calM:_now.getMonth()+1, calSel:null,
  topMode:'series', seriesTab:0, activeDay:0,
  page:null,                       // null | help | news | contact | mypage | cart | orderDone | profile
  bulkOpen:false, productOpen:false, cartAddedOpen:false,
  product:null, qty:{s2:1,s3:0,s4:0}, noCut:false, recQty:[0,0,0],
  cartItems:[
    {id:'c1',title:'てりやき親子丼 お揚げと野菜のおかず汁',tag:'スマイリーミール',accent:'#DB84AC',unit:'2人用',price:1350,qty:1,week:'5/11'},
    {id:'c2',title:'チキンソテー〜トマトガーリックソース〜 ウインナーとキャベツ',tag:'スタンダードミール',accent:'#6FA8D6',unit:'2人用',price:1350,qty:1,week:'5/11'},
    {id:'c3',title:'神戸ドーナツ プレーン・夏みかん＋キャラメル',tag:'食料雑貨',accent:'#8FC24A',unit:'',price:1490,qty:1,week:'5/11'},
  ],
};
let lastCartChange=Date.now(), remindShown=false;

const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');
const toNum=v=>Number(String(v).replace(/,/g,''))||0;
const cartCount=()=>S.cartItems.reduce((a,c)=>a+c.qty,0);
const cartSubtotal=()=>S.cartItems.reduce((a,c)=>a+c.price*c.qty,0);
const cartShip=()=>S.cartItems.length?330:0;

/* 画像プレースホルダー（No Image画像） */
function slot(label){
  return '<img src="assets/noimage.png" alt="'+label+'" style="width:100%;height:100%;object-fit:cover;display:block;">';
}

/* ================= アクション ================= */
const touchCart=()=>{lastCartChange=Date.now();};
const A={
  goSeries(){S.topMode='series';render();},
  goDelivery(){S.topMode='delivery';render();},
  setDay(i){S.activeDay=i;render();},
  goHome(){S.page=null;render();},
  openHelp(){S.page='help';render();},
  openNews(){S.page='news';render();},
  openContact(){S.page='contact';render();},
  openMypage(){if(!S.loggedIn){Login.open();return;}S.page='mypage';render();},
  openCart(){S.page='cart';render();},
  openProfile(){S.page='profile';render();},
  profileSave(){
    const el=document.querySelector('[data-prof-name]');
    if(el&&el.value.trim())S.userName=el.value.trim();
    S.profileSaved=true;render();
  },
  profileSavedClose(){S.profileSaved=false;render();},
  openLogin(){Login.open();},
  logout(){S.loggedIn=false;S.userName=null;S.page=null;location.href='lp.html';},

  /* 週の切り替え（複数週にわたり同一画面で注文可能） */
  setWeek(i){S.week=i;render();},
  nextWeek(){if(S.week<WEEKS.length-1)S.week++;S.page=null;render();window.scrollTo(0,0);},

  /* タブ（親／子／孫） */
  setMainTab(t){S.mainTab=t;S.ddOpen=null;render();},
  toggleDD(key){S.ddOpen=S.ddOpen===key?null:key;render();},
  setChild(key,idx){
    if(SPECIAL_TABS.some(t=>t.key===key)){S.specialChild=key;}
    else{S.child=key;}
    if(idx!==undefined)S.sub[key]=idx;
    S.ddOpen=null;render();
  },

  /* カレンダー */
  calPrev(){S.calM--;if(S.calM<1){S.calM=12;S.calY--;}S.calSel=null;render();},
  calNext(){S.calM++;if(S.calM>12){S.calM=1;S.calY++;}S.calSel=null;render();},
  calSelect(d){S.calSel={y:S.calY,m:S.calM,d};S.calCancelConfirm=false;render();},
  calClose(){S.calSel=null;S.calCancelConfirm=false;render();},
  calCancelAsk(){S.calCancelConfirm=true;render();},
  calCancelNo(){S.calCancelConfirm=false;render();},
  calCancelYes(){
    const s=S.calSel;
    if(s)S.cancelled[s.y+'-'+s.m+'-'+s.d]=true;
    S.calCancelConfirm=false;S.calSel=null;render();
  },

  /* 注文履歴のキャンセル */
  histAsk(type,id){if(!id)id='';S.histConfirm={type,id};render();},
  histNo(){S.histConfirm=null;render();},
  histYes(){
    const c=S.histConfirm;
    if(c){
      if(c.type==='all'){S.orders=S.orders.map(o=>({...o,status:'cancelled'}));}
      else{S.orders=S.orders.map(o=>o.id===c.id?{...o,status:'cancelled'}:o);}
    }
    S.histConfirm=null;render();
  },

  /* お気に入り */
  toggleFav(title,series,accent,price){
    const i=S.favs.findIndex(f=>f.title===title);
    if(i>=0)S.favs.splice(i,1);
    else S.favs.push({title,series,accent,price});
    render();
  },
  openFav(i){
    const f=S.favs[i];
    if(f)A._openProduct({title:f.title,seriesName:f.series,accent:f.accent,price:f.price});
  },

  /* 注文確定フロー：もう一品 → 確定 → 翌週の案内 */
  orderComplete(){
    if(!S.loggedIn){Login.open();return;}
    if(!S.cartItems.length){return;}
    S.lastChanceOpen=true;S.lastQty=0;render();
  },
  lastQtyChange(d){S.lastQty=Math.max(0,S.lastQty+d);render();},
  finalizeOrder(withExtra){
    if(withExtra&&S.lastQty>0){
      const r=REC[1];
      S.cartItems=[...S.cartItems,{id:'last-'+Date.now(),title:r.title,tag:r.tag,accent:r.tagColor,unit:'',price:toNum(r.price),qty:S.lastQty,week:WEEKS[S.week].label}];
    }
    const total=cartSubtotal()+cartShip();
    const pts=coinFor(total);
    S.coins+=pts;
    S.orders=[{id:'o-'+Date.now(),week:WEEKS[S.week].label,count:cartCount(),total,coins:pts,status:'active'},...S.orders];
    S.lastOrder={count:cartCount(),total,coins:pts,week:WEEKS[S.week].label};
    S.cartItems=[];S.lastChanceOpen=false;S.lastQty=0;S.page='orderDone';
    touchCart();render();window.scrollTo(0,0);
  },

  /* 確定お忘れリマインド（閉じてから30秒後に再表示） */
  remindClose(){S.remindOpen=false;touchCart();render();},
  remindGoCart(){S.remindOpen=false;S.page='cart';touchCart();render();},

  openBulk(){S.bulkOpen=true;render();},
  closeBulk(){S.bulkOpen=false;render();},
  confirmBulk(){
    const now=Date.now();
    const add=wdates(S.week).map(m=>({id:'bulk-'+m.id+'-'+now,title:m.title,tag:'スマイリーミール',accent:'#DB84AC',unit:'2人用',price:toNum(m.price),qty:1,week:WEEKS[S.week].label}));
    S.cartItems=[...S.cartItems,...add];S.bulkOpen=false;touchCart();render();
  },

  openSer(wi){
    const cs=SERIES[S.sub.smile]||SERIES[0], m=wdates(S.week)[wi];
    A._openProduct({title:m.title,seriesName:cs.name,accent:cs.accent,price:toNum(m.price)});
  },
  openSmile(i){
    const s=SERIES[SMILE[i].si];
    A._openProduct({title:'てりやき親子丼 お揚げと野菜のおかず汁',seriesName:s.name,accent:s.accent,price:1350});
  },
  openMore(i){
    const c=MORE[i];
    A._openProduct({title:c.title,seriesName:c.tag,accent:c.accent,price:toNum(c.price)});
  },
  openGrid(i){
    const cat=CATALOG.find(c=>c.key===S.child);
    const subName=cat.subs[S.sub[cat.key]]||cat.name;
    const it=subItems(subName)[i];
    A._openProduct({title:it.title,seriesName:subName,accent:cat.accent,price:toNum(it.price)});
  },
  openSpecial(id){
    const p=SPECIALS.find(x=>x.id===id);
    if(!p)return;
    if(p.requires&&!cartHasSeries(p.requires))return;  // 条件未達はカード側で誘導
    if(p.limit&&(S.stock[p.id]||0)<=0)return;          // 売り切れ
    A._openProduct({title:p.title,seriesName:'特別販売',accent:'#E0912C',price:p.price,special:true,specialId:p.id,limit:p.limit});
  },
  gotoRequired(){
    /* 条件商品 →「対象メニューを見る」：夕食献立のスマイリーミールへ誘導 */
    S.mainTab='dinner';S.child='smile';S.sub.smile=0;S.ddOpen=null;render();window.scrollTo(0,0);
  },
  _openProduct(p){
    S.product={...p,dateLabel:WEEKS[S.week].label+'週 お届け'};
    S.productOpen=true;S.qty={s2:p.special?1:1,s3:0,s4:0};S.cut='on';render();
  },
  closeProduct(){S.productOpen=false;render();},
  changeQty(k,d){
    let v=Math.max(0,S.qty[k]+d);
    const p=S.product||{};
    if(p.special&&p.limit){const st=S.stock[p.specialId]||0;v=Math.min(v,st);}  // 残数を超えない
    S.qty[k]=v;render();
  },
  setCut(v){S.cut=v;render();},
  addToCart(){
    const p=S.product||{};
    const t=S.qty,n=p.special?t.s2:(t.s2+t.s3+t.s4);
    if(n<=0){S.productOpen=false;render();return;}
    const unit=p.special?'':(t.s4?'4人用':(t.s3?'3人用':'2人用'));
    const cutLabel=p.special?'':(S.cut==='on'?'／カットあり':'／カットなし');
    S.cartItems=[...S.cartItems,{id:'add-'+Date.now(),title:p.title||'商品',tag:(p.seriesName||'')+cutLabel,accent:p.accent||'#DB84AC',unit,price:p.price||1350,qty:n,week:WEEKS[S.week].label}];
    if(p.special&&p.limit){S.stock[p.specialId]=Math.max(0,(S.stock[p.specialId]||0)-n);}
    S.recMode=p.special?'menus':'goods';  // 特別商品のときは通常メニューをレコメンド
    S.productOpen=false;S.cartAddedOpen=true;S.recQty=[0,0,0];touchCart();render();
  },
  recChange(i,d){S.recQty[i]=Math.max(0,S.recQty[i]+d);render();},
  addRec(){
    const now=Date.now();
    let add=[];
    if(S.recMode==='menus'){
      const menus=wdates(S.week).slice(0,3);
      add=menus.map((m,i)=>({m,q:S.recQty[i]})).filter(x=>x.q>0)
        .map(x=>({id:'recm-'+x.m.id+'-'+now,title:x.m.title,tag:'スマイリーミール',accent:'#DB84AC',unit:'2人用',price:toNum(x.m.price),qty:x.q,week:WEEKS[S.week].label}));
    }else{
      add=REC.map((r,i)=>({r,q:S.recQty[i]})).filter(x=>x.q>0)
        .map(x=>({id:'rec-'+x.r.id+'-'+now,title:x.r.title,tag:x.r.tag,accent:x.r.tagColor,unit:'',price:toNum(x.r.price),qty:x.q,week:WEEKS[S.week].label}));
    }
    S.cartItems=[...S.cartItems,...add];S.cartAddedOpen=false;S.recQty=[0,0,0];touchCart();render();
  },
  skipRec(){S.cartAddedOpen=false;S.recQty=[0,0,0];render();},
  cartQty(id,d){S.cartItems=S.cartItems.map(c=>c.id===id?{...c,qty:Math.max(1,c.qty+d)}:c);touchCart();render();},
  removeCart(id){S.cartItems=S.cartItems.filter(c=>c.id!==id);touchCart();render();},
};

  const p=S.product||{};

  else{selTotal=SIZES.reduce((a,s)=>a+(S.qty[s.k]||0)*toNum(s.price),0);}

    +'<span style="color:#E0912C;">'+IC.coin(17)+'</span>'

const DOWJ=['日','月','火','水','木','金','土'];
/* 配達データ（モック）：月〜金に配達あり。献立は曜日ごとに WEEK から割り当て */
function calDelivery(y,m,d){
  const dow=new Date(y,m-1,d).getDay();
  if(dow===0||dow===6)return null;
  return {menu:WEEK[dow-1],dow};
}

function calendarHTML(sp){
  const y=S.calY,m=S.calM;
  const firstDow=new Date(y,m-1,1).getDay();
  const days=new Date(y,m,0).getDate();
  const now=new Date();
  const isToday=(d)=>now.getFullYear()===y&&now.getMonth()+1===m&&now.getDate()===d;
  const sel=S.calSel;
  const cellH=sp?60:84;
  const emptyCell='<div style="border-top:1px solid #EAE5D9;border-left:1px solid #EAE5D9;background:#fff;"></div>';
  let cells='';
  for(let i=0;i<firstDow;i++)cells+=emptyCell;
  for(let d=1;d<=days;d++){
    const del=calDelivery(y,m,d);
    const selected=sel&&sel.y===y&&sel.m===m&&sel.d===d;
    const st='border-top:1px solid #EAE5D9;border-left:1px solid #EAE5D9;background:'+(selected?'#FCEBEC':'#fff')
      +';min-height:'+cellH+'px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:'+(sp?4:6)+'px;width:100%;'
      +(isToday(d)?'box-shadow:inset 0 0 0 2px #E50012;':'');
    const num='<span style="font-size:'+(sp?14:15)+'px;font-weight:700;color:#2b2b2b;line-height:1;">'+d+'</span>';
    const dayCancelled=!!S.cancelled[y+'-'+m+'-'+d];
    const badge=del?(dayCancelled
      ?'<span style="background:#BBB;color:#fff;font-size:'+(sp?8:10)+'px;font-weight:700;border-radius:9px;padding:2px '+(sp?4:7)+'px;white-space:nowrap;line-height:1.3;">ｷｬﾝｾﾙ済</span>'
      :'<span style="background:#E50012;color:#fff;font-size:'+(sp?8.5:10.5)+'px;font-weight:700;border-radius:9px;padding:2px '+(sp?5:8)+'px;white-space:nowrap;line-height:1.3;">配達あり</span>'):'';
    if(del)cells+='<button onclick="A.calSelect('+d+')" style="'+st+'">'+num+badge+'</button>';
    else cells+='<div style="'+st+'">'+num+'</div>';
  }
  const trail=(7-((firstDow+days)%7))%7;
  for(let i=0;i<trail;i++)cells+=emptyCell;
  const header=DOWJ.map(w=>'<div style="border-top:1px solid #EAE5D9;border-left:1px solid #EAE5D9;background:#FBF7EE;padding:8px 0;text-align:center;font-size:12.5px;font-weight:700;color:#5a5145;">'+w+'</div>').join('');
  return '<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px;">'
    +'<button onclick="A.calPrev()" style="color:#E50012;font-size:'+(sp?13:14)+'px;font-weight:800;">&lt; 先月</button>'
    +'<span style="font-size:'+(sp?16:18)+'px;font-weight:800;color:#4a4235;">'+y+'年'+m+'月</span>'
    +'<button onclick="A.calNext()" style="color:#E50012;font-size:'+(sp?13:14)+'px;font-weight:800;">翌月 &gt;</button>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);border-right:1px solid #EAE5D9;border-bottom:1px solid #EAE5D9;">'+header+cells+'</div>'
    +'<div style="font-size:11px;color:#9a9083;margin-top:10px;text-align:center;">「配達あり」の日をタップすると、お届け予定の献立が表示されます</div>';
}

      +'<div style="display:flex;gap:15px;align-items:flex-start;">'

      +'<div><div style="font-size:18px;font-weight:700;line-height:1.45;color:#2b2b2b;">スマイリーミール 5日間分（月〜金）</div>'
      +'<div style="font-size:16px;font-weight:700;margin-top:8px;color:#2b2b2b;">2人用 6,880円〜</div></div></div>'
      +'<div style="margin-top:18px;">'+bulkRowsHTML()+'</div>'
      +'<button onclick="A.confirmBulk()" style="margin-top:20px;width:100%;background:#E50012;color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:10px;">カートに追加する</button>'

  /* ---- 商品詳細モーダル ---- */

      +'<div style="flex:1;min-width:0;display:flex;flex-direction:column;">'
      +'<div style="display:flex;align-items:center;gap:9px;padding:20px 22px 0;">'

      +'<span style="background:'+p.accent+';color:#fff;border-radius:13px;padding:3px 12px;font-size:11px;font-weight:700;white-space:nowrap;">'+p.seriesName+'</span>'

      +'<div style="padding:16px 22px 8px;">'
      +'<div style="font-size:19px;font-weight:700;color:#2b2b2b;line-height:1.4;">'+p.title+'</div>'
      +cutHTML()
      +'<div style="margin-top:18px;">'+sizeRowsHTML()+'</div>'
      +coinPreviewHTML()
      +'</div>'
      +'<div style="margin-top:auto;display:flex;gap:12px;padding:16px 22px 22px;border-top:1px solid #EEE;">'
      +'<button style="width:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;box-shadow:0 0 0 1.5px #D8D8D8 inset;padding:10px;color:#333;">'+IC.book(21)+'<span style="font-size:12px;">レシピページ</span></button>'

      +'<div style="padding:22px 22px 12px;">'
      +'<div style="display:flex;align-items:center;gap:10px;"><span style="width:24px;height:24px;border-radius:50%;background:#E50012;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+IC.check(14)+'</span>'

  h+='</div>';

  /* ---- 最上位レイヤーのモーダル群 ---- */

  h+=remindHTML();
  h+=histConfirmHTML();
  h+=profileSavedHTML();

  return h;

/* ================= レンダリング（スクロール位置保持付き） ================= */
function render(){
  const winY=window.scrollY;
  const saved={};
  document.querySelectorAll('[data-sc]').forEach(el=>{
    saved[el.getAttribute('data-sc')]={top:el.scrollTop,left:el.scrollLeft};
  });
  document.getElementById('sp-root').innerHTML=spHTML();
  document.getElementById('pc-root').innerHTML=pcHTML();
  document.querySelectorAll('[data-sc]').forEach(el=>{
    const s=saved[el.getAttribute('data-sc')];
    if(s){el.scrollTop=s.top;el.scrollLeft=s.left;}
  });
  window.scrollTo(0,winY);
}

/* ================= ログインフロー（yoshikei-login-flow.html より移植） ================= */
const Login=(function(){
  // 収集データ（taste_profiles 準拠・他プロジェクトへの受け渡し用）
  const taste_profile={user_name:null,serving:null,taste_weights:{},genre_weights:{},cook_time:null,health:null,allergens:[],preferred_days:null};
  window.taste_profile=taste_profile;

  const TASTE_WEIGHTS={
    'こってり派':{'こってり':1.0,'標準':0.5,'さっぱり':0.2},
    'さっぱり派':{'こってり':0.2,'標準':0.5,'さっぱり':1.0},
    'バランスよく':{'こってり':0.6,'標準':1.0,'さっぱり':0.6},
  };
  const ALLERGEN_MAP={'えび・かに':['えび','かに'],'卵':['卵'],'乳':['乳'],'小麦':['小麦']};
  const GENRE_MAP={'和食':'和風','洋食':'洋風','中華':'中華'};

  // お届けエリア判定用ダミーデータ（本番は郵便番号＋町名で判定するため、町名粒度に差し替えられるよう判定ロジックと分離して保持）
  const AREA_ZIPS=[
    {prefix:'930',office:'富山営業所'},
    {prefix:'933',office:'高岡営業所'},
    {prefix:'920',office:'金沢営業所'},
    {prefix:'921',office:'金沢南営業所'},
    {prefix:'500',office:'岐阜営業所'},
    {prefix:'501',office:'岐阜西営業所'},
  ];
  const findOffice=(zip)=>{const hit=AREA_ZIPS.find(a=>zip.indexOf(a.prefix)===0);return hit?hit.office:null;};
  // 判定結果の保持（後続画面から window.area_state で参照できる）
  const area_state={zip:null,office:null};
  window.area_state=area_state;

  const QUESTIONS=[
    {key:'serving',       q:'何人分のお食事を用意しますか？',                 multi:false, opts:['2人分','3人分','4人分以上']},
    {key:'taste',         q:'お好みの味付けは？',                             multi:false, opts:['こってり派','さっぱり派','バランスよく']},
    {key:'genre',         q:'よく食べたいジャンルは？（複数OK）',             multi:true,  opts:['和食','洋食','中華']},
    {key:'cook_time',     q:'調理にかけられる時間は？',                       multi:false, opts:['10分以内','20分以内','しっかり作りたい']},
    {key:'health',        q:'健康面で気になることは？',                       multi:false, opts:['カロリー','塩分','特になし']},
    {key:'allergens',     q:'苦手な食材やアレルギーはありますか？（複数OK）', multi:true,  opts:['えび・かに','卵','乳','小麦','なし'], noSkip:true},
    {key:'preferred_days',q:'週に何日くらい利用したいですか？',               multi:false, opts:['3日','5日','まずはお試し']},
  ];
  const ILLUSTS=[1,2,3,4,5,6,7].map(n=>'assets/onboard_q'+n+'.svg');

  let step=0, answers={}, phase='zip', zipValue='';
  const $=(sel)=>document.querySelector(sel);

  function open(){$('[data-login-overlay]').style.display='flex';}
  function close(){$('[data-login-overlay]').style.display='none';}
  function startOnboard(){step=0;answers={};phase='zip';zipValue='';$('[data-onboard-overlay]').style.display='flex';renderStep();}

  /* ステップ0：お住まいの地域（郵便番号）確認 */
  function renderZip(okOffice){
    const body=$('[data-onboard-body]'),bar=$('[data-onboard-bar]'),lbl=$('[data-onboard-step]');
    bar.style.width='5%';
    lbl.textContent='エリア確認';
    const filled=zipValue.length===7;
    body.innerHTML='<div style="max-width:460px;margin:0 auto;">'
      +'<div class="onboard-q-title"><span>お住まいの地域を教えてください</span></div>'
      +'<p style="font-size:14px;color:#777;margin:0 0 22px;">お届けできる地域かご確認します</p>'
      +'<input data-zip-input type="text" inputmode="numeric" autocomplete="postal-code" maxlength="8" placeholder="郵便番号（数字7桁）" value="'+zipValue+'" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:14px;font-size:16px;font-family:inherit;letter-spacing:.08em;margin-bottom:16px;">'
      +'<button data-zip-check '+(filled&&!okOffice?'':'disabled ')+'style="width:100%;border:none;background:'+(filled?'#E50012':'#e0dcd5')+';color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:12px;'+(filled?'':'cursor:default;')+'">確認する</button>'
      +(okOffice?'<div style="margin-top:16px;background:#eef7ee;border:1px solid #bfe0c2;color:#2e7d32;font-size:14px;font-weight:700;border-radius:12px;padding:13px 14px;text-align:center;">お届けエリアです（担当：'+okOffice+'）</div>':'')
      +'</div>';
  }
  function renderZipNg(){
    const body=$('[data-onboard-body]'),bar=$('[data-onboard-bar]'),lbl=$('[data-onboard-step]');
    bar.style.width='5%';
    lbl.textContent='エリア確認';
    body.innerHTML='<div style="max-width:460px;margin:0 auto;">'
      +'<div class="onboard-q-title"><span>申し訳ございません。ご入力の地域は当社のお届けエリア外です</span></div>'
      +'<p style="font-size:14px;color:#666;line-height:1.9;margin:0 0 24px;">お住まいの地域は別のヨシケイが担当している場合があります。お近くのヨシケイは以下からご確認いただけます</p>'
      +'<a href="#" data-zip-find style="display:block;text-align:center;background:#E50012;color:#fff;font-size:15px;font-weight:700;padding:15px;border-radius:12px;text-decoration:none;">お近くのヨシケイを探す</a>'
      +'<p style="font-size:12.5px;color:#999;line-height:1.8;margin:16px 0 0;">ご不明な場合はフリーダイヤル 0120-XXX-XXX へお問い合わせください</p>'
      +'<div style="text-align:center;margin-top:22px;"><button data-zip-retry style="border:none;background:transparent;color:#999;font-size:13px;font-weight:700;text-decoration:underline;">郵便番号を入力し直す</button></div>'
      +'</div>';
  }
  function checkZip(){
    if(zipValue.length!==7)return;
    const office=findOffice(zipValue);
    area_state.zip=zipValue;
    area_state.office=office;
    if(office){
      S.office=office;
      renderZip(office);
      setTimeout(()=>{if(phase==='zip'){phase='questions';step=0;renderStep();}},1100);
    }else{
      phase='zipNg';
      renderStep();
    }
  }

  function renderStep(){
    if(phase==='zip'){renderZip();return;}
    if(phase==='zipNg'){renderZipNg();return;}
    const body=$('[data-onboard-body]'),bar=$('[data-onboard-bar]'),lbl=$('[data-onboard-step]');
    if(step<7){
      const Q=QUESTIONS[step];
      bar.style.width=((step+1)/7*100)+'%';
      lbl.textContent=(step+1)+' / 7';
      const sel=answers[Q.key]||(Q.multi?[]:null);
      const opts=Q.opts.map(o=>{
        const on=Q.multi?(sel.indexOf(o)>=0):(sel===o);
        return '<button data-opt="'+o+'" style="display:block;width:100%;text-align:left;border:2px solid '+(on?'#E50012':'#e2ded7')+';background:'+(on?'#fdf0f1':'#fff')+';color:'+(on?'#E50012':'#444')+';font-size:16px;font-weight:700;padding:16px 18px;border-radius:14px;margin-bottom:12px;">'+o+'</button>';
      }).join('');
      let footer='';
      const answered=Q.multi?(sel&&sel.length):(sel!==null&&sel!==undefined);
      if(Q.multi||answered){footer+='<button data-onboard-next style="width:100%;border:none;background:#E50012;color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:12px;margin-top:6px;">次へ</button>';}
      if(!Q.noSkip){footer+='<div style="text-align:center;margin-top:14px;"><button data-onboard-skip style="border:none;background:transparent;color:#999;font-size:13px;font-weight:700;text-decoration:underline;">あとで設定する</button></div>';}
      if(step>=1){footer+='<div style="text-align:center;margin-top:18px;"><button data-onboard-back style="border:none;background:transparent;color:#999;font-size:13px;font-weight:700;">← 前の質問に戻る</button></div>';}
      body.innerHTML='<div style="max-width:460px;margin:0 auto;">'
        +'<div class="onboard-q-title"><span>'+Q.q+'</span></div>'
        +'<img class="onboard-illust" src="'+(ILLUSTS[step]||'')+'" alt="">'
        +opts+footer+'</div>';
    }else{
      bar.style.width='100%';
      lbl.textContent='あと少し！';
      body.innerHTML='<div style="max-width:460px;margin:0 auto;">'
        +'<div style="font-size:22px;font-weight:700;color:#3a3a3a;line-height:1.5;margin-bottom:24px;">お名前を教えてください</div>'
        +'<input data-onboard-name type="text" placeholder="お名前（ニックネーム可）" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:14px;font-size:16px;font-family:inherit;margin-bottom:16px;">'
        +'<button data-onboard-finish style="width:100%;border:none;background:#E50012;color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:12px;">登録完了</button>'
        +'<div style="text-align:center;margin-top:18px;"><button data-onboard-back style="border:none;background:transparent;color:#999;font-size:13px;font-weight:700;">← 前の質問に戻る</button></div>'
        +'</div>';
    }
  }
  function single(v){answers[QUESTIONS[step].key]=v;step++;renderStep();}
  function toggle(v){
    const Q=QUESTIONS[step];let arr=answers[Q.key]||[];
    if(Q.key==='allergens'&&v==='なし'){arr=['なし'];}
    else{
      const i=arr.indexOf(v);
      if(i>=0)arr.splice(i,1);
      else{arr.push(v);const ni=arr.indexOf('なし');if(ni>=0)arr.splice(ni,1);}
    }
    answers[Q.key]=arr;renderStep();
  }
  function next(){const Q=QUESTIONS[step];if(Q.noSkip){const arr=answers[Q.key]||[];if(!arr.length)return;}step++;renderStep();}
  function back(){if(step>0){step--;renderStep();}}

  function buildProfile(name){
    taste_profile.user_name=name;
    const sv=answers.serving;
    taste_profile.serving=sv==='2人分'?2:sv==='3人分'?3:sv==='4人分以上'?4:null;
    taste_profile.taste_weights=TASTE_WEIGHTS[answers.taste]||{};
    const gw={};(answers.genre||[]).forEach(g=>{if(GENRE_MAP[g])gw[GENRE_MAP[g]]=1.0;});
    taste_profile.genre_weights=gw;
    taste_profile.cook_time=answers.cook_time||null;
    taste_profile.health=(answers.health&&answers.health!=='特になし')?answers.health:null;
    let al=[];(answers.allergens||[]).forEach(a=>{if(ALLERGEN_MAP[a])al=al.concat(ALLERGEN_MAP[a]);});
    taste_profile.allergens=al;
    taste_profile.preferred_days=answers.preferred_days||null;
  }

  // ログイン成立 → サイト本体へ（PC/SP共通の状態を更新。表示中ページは維持）
  function completeLogin(name){
    S.loggedIn=true;S.userName=name;render();
    try{history.replaceState(null,'',location.pathname);}catch(e){}
    try{console.log('[login_flow] taste_profile =',taste_profile);}catch(e){}
  }

  function doEmailLogin(){
    const em=$('[data-login-email]');
    if(!em||!em.value.trim()){if(em)em.focus();return;}
    taste_profile.user_name='会員';
    close();
    completeLogin('会員');
  }

  function finish(){
    const nameEl=$('[data-onboard-name]');
    const name=(nameEl&&nameEl.value.trim())||'会員';
    buildProfile(name);
    playWelcome(name);
  }

  // ようこそ演出：名前表示 → 赤い円の拡大トランジション → サイト本体へ
  function playWelcome(name){
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ob=$('[data-onboard-overlay]');
    const removeOverlay=()=>{if(ob)ob.style.display='none';};

    const wel=document.createElement('div');
    wel.style.cssText='position:fixed;inset:0;z-index:1000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;transition:opacity .4s ease;';
    wel.innerHTML='<div style="font-size:24px;font-weight:700;color:#3a3a3a;line-height:1.8;">'+name+'さん、ようこそ。</div>'
      +'<div style="font-size:24px;font-weight:700;color:#3a3a3a;line-height:1.8;">お楽しみください。</div>';
    document.body.appendChild(wel);
    requestAnimationFrame(()=>{wel.style.opacity='1';});

    if(reduce){
      setTimeout(()=>{
        removeOverlay();
        if(wel.parentNode)wel.parentNode.removeChild(wel);
        completeLogin(name);
      },1400);
      return;
    }

    setTimeout(()=>{
      const circle=document.createElement('div');
      const dia=Math.ceil(Math.sqrt(window.innerWidth*window.innerWidth+window.innerHeight*window.innerHeight));
      const size=dia*2.4;
      circle.style.cssText='position:fixed;top:50%;left:50%;width:'+size+'px;height:'+size+'px;margin:'+(-size/2)+'px 0 0 '+(-size/2)+'px;border-radius:50%;background:#E50012;z-index:1001;transform:scale('+(20/size)+');transition:transform .6s ease-in;';
      document.body.appendChild(circle);
      requestAnimationFrame(()=>{circle.style.transform='scale(1)';});
      setTimeout(()=>{
        removeOverlay();
        if(wel.parentNode)wel.parentNode.removeChild(wel);
        completeLogin(name);
        circle.style.transition='opacity .5s ease';
        circle.style.opacity='0';
        setTimeout(()=>{if(circle.parentNode)circle.parentNode.removeChild(circle);},520);
      },620);
    },1400);
  }

  /* イベント配線（オーバーレイは再描画対象外の静的DOM） */
  const lo=$('[data-login-overlay]');
  lo.addEventListener('click',e=>{
    if(e.target===lo||e.target.closest('[data-login-close]')){close();return;}
    if(e.target.closest('[data-login-submit]')){doEmailLogin();return;}
    if(e.target.closest('[data-onboard-start]')){close();startOnboard();return;}
  });
  const ob=$('[data-onboard-overlay]');
  // 郵便番号入力：ハイフン等は自動除去し数字7桁に整形（再描画せず値だけ整形＝フォーカス維持）
  ob.addEventListener('input',e=>{
    const z=e.target.closest('[data-zip-input]');
    if(!z)return;
    const v=z.value.replace(/[^0-9]/g,'').slice(0,7);
    if(z.value!==v)z.value=v;
    zipValue=v;
    const btn=$('[data-zip-check]');
    if(btn){
      const on=v.length===7;
      btn.disabled=!on;
      btn.style.background=on?'#E50012':'#e0dcd5';
      btn.style.cursor=on?'pointer':'default';
    }
  });
  ob.addEventListener('click',e=>{
    if(e.target.closest('[data-onboard-close]')){ob.style.display='none';return;}
    if(e.target.closest('[data-zip-check]')){checkZip();return;}
    if(e.target.closest('[data-zip-retry]')){phase='zip';renderStep();return;}
    if(e.target.closest('[data-zip-find]')){e.preventDefault();return;}
    const opt=e.target.closest('[data-opt]');
    if(opt){const Q=QUESTIONS[step];if(Q.multi)toggle(opt.getAttribute('data-opt'));else single(opt.getAttribute('data-opt'));return;}
    if(e.target.closest('[data-onboard-next]')){next();return;}
    if(e.target.closest('[data-onboard-skip]')){step++;renderStep();return;}
    if(e.target.closest('[data-onboard-back]')){back();return;}
    if(e.target.closest('[data-onboard-finish]')){finish();return;}
  });

  return {open};
})();

/* ================= 検索（商品名・カテゴリ） ================= */
const Search=(function(){
  let results=[];
  const ov=()=>document.querySelector('[data-search-overlay]');
  function dataset(){
    const ds=[];
    wdates(S.week).forEach(m=>ds.push({kind:'menu',title:m.title,cat:'夕食献立メニュー／スマイリーミール',price:toNum(m.price),accent:'#DB84AC',series:'スマイリーミール'}));
    MORE.forEach(c=>ds.push({kind:'menu',title:c.title,cat:'＆more／'+c.tag,price:toNum(c.price),accent:c.accent,series:c.tag}));
    REC.forEach(r=>ds.push({kind:'menu',title:r.title,cat:r.tag,price:toNum(r.price),accent:r.tagColor,series:r.tag}));
    CATALOG.forEach(c=>c.subs.forEach(sname=>subItems(sname).forEach(it=>ds.push({kind:'menu',title:it.title,cat:c.name+'／'+sname,price:toNum(it.price),accent:c.accent,series:sname}))));
    SPECIALS.forEach(p=>ds.push({kind:'special',id:p.id,title:p.title,cat:'特別販売',price:p.price,accent:'#E0912C',series:'特別販売'}));
    return ds;
  }
  function renderResults(q){
    const box=document.querySelector('[data-search-results]');
    q=(q||'').trim();
    if(!q){box.innerHTML='<div style="padding:26px;text-align:center;font-size:12.5px;color:#999;">商品名やカテゴリ名を入力してください</div>';results=[];return;}
    results=dataset().filter(d=>d.title.indexOf(q)>=0||d.cat.indexOf(q)>=0).slice(0,30);
    if(!results.length){box.innerHTML='<div style="padding:26px;text-align:center;font-size:12.5px;color:#999;">「'+q+'」に一致する商品が見つかりませんでした</div>';return;}
    box.innerHTML=results.map((d,i)=>'<div onclick="Search.pick('+i+')" style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #F4F4F4;cursor:pointer;">'
      +'<div style="width:54px;height:44px;border-radius:7px;overflow:hidden;flex-shrink:0;">'+slot(d.title)+'</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="font-size:10.5px;color:#999;">'+d.cat+'</div>'
      +'<div style="font-size:13px;font-weight:700;color:#2b2b2b;margin-top:2px;">'+d.title+'</div>'
      +'</div>'
      +'<span style="font-size:13.5px;font-weight:800;color:#2b2b2b;flex-shrink:0;">'+Number(d.price).toLocaleString('ja-JP')+'円</span>'
      +'</div>').join('');
  }
  function open(){
    ov().style.display='flex';
    const inp=document.querySelector('[data-search-input]');
    inp.value='';renderResults('');
    setTimeout(()=>inp.focus(),60);
  }
  function close(){ov().style.display='none';}
  function pick(i){
    const d=results[i];if(!d)return;
    close();
    if(d.kind==='special'){A.openSpecial(d.id);}
    else{A._openProduct({title:d.title,seriesName:d.series,accent:d.accent,price:d.price});}
  }
  document.querySelector('[data-search-input]').addEventListener('input',e=>renderResults(e.target.value));
  ov().addEventListener('click',e=>{if(e.target===ov()||e.target.closest('[data-search-close]'))close();});
  return {open,close,pick};
})();

/* ================= 確定お忘れリマインド（カート放置30秒ごとに表示） =================
   ※ 暫定ルール：30秒に1回。今後は画面遷移等をトリガーにルール化予定 */
setInterval(()=>{

     &&!S.productOpen&&!S.cartAddedOpen&&!S.lastChanceOpen&&!S.remindOpen&&!S.bulkOpen
